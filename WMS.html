<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재고관리 시스템 (Supabase 연동)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #f8fafc; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tab-btn.active { border-bottom: 2px solid #4f46e5; color: #4f46e5; font-weight: bold; }
    /* Custom Scrollbar for tables */
    .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800">

  <!-- 헤더 -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center space-x-3">
          <div class="bg-indigo-100 text-indigo-600 p-2 rounded-lg">
            <i class="fa-solid fa-boxes-stacked text-xl"></i>
          </div>
          <h1 class="text-xl font-bold text-slate-800 tracking-tight">통합 재고관리 솔루션</h1>
        </div>
        <div class="flex items-center gap-3">
          <span id="db-status" class="text-xs font-semibold px-2 py-1 rounded bg-amber-100 text-amber-700">
            <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> DB 연결 중...
          </span>
          <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-file-excel"></i> 엑셀 다운로드
          </button>
        </div>
      </div>
      <!-- 네비게이션 탭 -->
      <nav class="flex space-x-6 text-sm font-medium text-slate-500 overflow-x-auto border-b border-slate-200">
        <button class="tab-btn active pb-3 px-1 whitespace-nowrap transition" onclick="switchTab('tab-dashboard', this)">
          <i class="fa-solid fa-chart-pie mr-1"></i> 대시보드 & 입출고
        </button>
        <button class="tab-btn pb-3 px-1 whitespace-nowrap transition" onclick="switchTab('tab-inventory', this)">
          <i class="fa-solid fa-warehouse mr-1"></i> 재고 현황(수불부)
        </button>
        <button class="tab-btn pb-3 px-1 whitespace-nowrap transition" onclick="switchTab('tab-analytics', this)">
          <i class="fa-solid fa-chart-line mr-1"></i> 월별/분기별 분석
        </button>
      </nav>
    </div>
  </header>

  <!-- 메인 컨텐츠 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- [탭 1] 대시보드 & 입출고 -->
    <div id="tab-dashboard" class="tab-content active space-y-6">
      
      <!-- 상단 요약 통계 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="summary-cards">
        <!-- JS 렌더링 -->
      </div>

      <div class="flex flex-col lg:flex-row gap-6">
        
        <!-- 좌측: 빠른 입출고 등록 폼 -->
        <div class="w-full lg:w-1/3 bg-white p-6 rounded-xl shadow-sm border border-slate-200 self-start">
          <h2 class="text-base font-bold mb-5 flex items-center gap-2">
            <i class="fa-solid fa-bolt text-amber-500"></i> 빠른 입출고 등록
          </h2>
          
          <form id="txForm" onsubmit="saveTransaction(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">구분</label>
              <div class="flex gap-2">
                <button type="button" id="btnTypeIn" onclick="setTxType('IN')" class="flex-1 py-2.5 border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-bold rounded-lg transition">입고</button>
                <button type="button" id="btnTypeOut" onclick="setTxType('OUT')" class="flex-1 py-2.5 border-2 border-slate-200 text-slate-500 font-bold rounded-lg transition">출고</button>
              </div>
              <input type="hidden" id="txType" value="IN">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">일자</label>
              <input type="date" id="txDate" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
              <div class="flex justify-between items-end mb-1.5">
                <label class="block text-xs font-semibold text-slate-500">상품 선택</label>
                <button type="button" onclick="openNewProductModal()" class="text-xs text-indigo-600 font-bold hover:underline">
                  + 새 상품 등록
                </button>
              </div>
              <select id="productSelect" onchange="updateOptionSelect()" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="">-- 상품명 선택 --</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">옵션 선택 (색상 / 용량)</label>
              <select id="optionSelect" onchange="onOptionSelectChange()" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="">-- 위에서 상품을 먼저 선택하세요 --</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div id="wrapLocationIn">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">입고지</label>
                <input type="text" id="txInLocation" placeholder="예: 본사 물류창고" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
              <div id="wrapLocationOut" class="hidden">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">출고지</label>
                <input type="text" id="txOutLocation" placeholder="예: 강남지점" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">수량</label>
                <input type="number" id="txQty" required min="1" value="1" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div id="wrapPriceIn">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">입고가 (원)</label>
                <input type="number" id="txInPrice" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
              <div id="wrapPriceOut" class="hidden">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">출고가 (원)</label>
                <input type="number" id="txOutPrice" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1.5">비고 (선택)</label>
              <input type="text" id="txMemo" placeholder="사유 또는 거래처" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition shadow">
              <i class="fa-solid fa-save mr-1"></i> 내역 저장
            </button>
          </form>
        </div>

        <!-- 우측: 최근 입출고 리스트 -->
        <div class="w-full lg:w-2/3 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[700px]">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold flex items-center gap-2">
              <i class="fa-solid fa-clock-rotate-left text-indigo-500"></i> 최근 입출고 내역
            </h2>
            <button onclick="loadData()" class="text-xs font-medium text-slate-500 hover:text-indigo-600 flex items-center gap-1 bg-slate-100 hover:bg-indigo-50 px-2 py-1 rounded transition">
              <i class="fa-solid fa-rotate-right"></i> 갱신
            </button>
          </div>
          
          <div class="table-container overflow-y-auto flex-1 border border-slate-200 rounded-lg">
            <table class="min-w-full text-sm text-left" id="table-transactions">
              <thead class="bg-slate-50 sticky top-0 z-10">
                <tr>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600 whitespace-nowrap">일자</th>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600 whitespace-nowrap">구분</th>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600">카테고리 / 상품명</th>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600">옵션 (색상/용량)</th>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600">입/출고지</th>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600 text-right">수량</th>
                  <th class="py-3 px-4 border-b font-semibold text-slate-600 text-center">삭제</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100" id="listTransactions">
                <tr><td colspan="7" class="text-center py-10 text-slate-400">데이터를 불러오는 중입니다...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- [탭 2] 재고 현황(수불부) -->
    <div id="tab-inventory" class="tab-content bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-boxes-packing text-indigo-600"></i> 기간별 재고 수불부
          </h2>
          <p class="text-xs text-slate-500 mt-1">지정한 기간 동안의 기초재고, 입출고량, 기말(현재)재고를 산출합니다.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
          <input type="date" id="filterStartDate" class="bg-white border border-slate-300 rounded p-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <span class="text-slate-400 font-bold">~</span>
          <input type="date" id="filterEndDate" class="bg-white border border-slate-300 rounded p-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <button onclick="renderInventoryTable()" class="bg-slate-800 text-white px-3 py-1.5 rounded text-sm font-semibold hover:bg-slate-700 transition shadow-sm">
            조회
          </button>
        </div>
      </div>
      
      <div class="table-container overflow-x-auto border border-slate-200 rounded-lg">
        <table class="min-w-full text-sm text-left" id="table-inventory">
          <thead class="bg-slate-50">
            <tr>
              <th class="py-3 px-4 border-b font-semibold text-slate-600">카테고리</th>
              <th class="py-3 px-4 border-b font-semibold text-slate-600">상품명</th>
              <th class="py-3 px-4 border-b font-semibold text-slate-600">옵션 (색상)</th>
              <th class="py-3 px-4 border-b font-semibold text-slate-600">단위 (용량)</th>
              <th class="py-3 px-4 border-b font-semibold text-slate-600 text-right">기초재고</th>
              <th class="py-3 px-4 border-b font-semibold text-emerald-700 text-right">입고 (+)</th>
              <th class="py-3 px-4 border-b font-semibold text-rose-700 text-right">출고 (-)</th>
              <th class="py-3 px-4 border-b font-bold text-indigo-700 text-right bg-indigo-50/50">기말재고</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100" id="listInventory">
            <!-- JS 렌더링 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- [탭 3] 월별/분기별 분석 -->
    <div id="tab-analytics" class="tab-content bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-chart-column text-indigo-600"></i> 월별 입출고 추이
        </h2>
        <p class="text-xs text-slate-500 mt-1">월별로 입고 및 출고의 합계와 순증감(차이)을 분석합니다.</p>
      </div>
      <div class="table-container overflow-x-auto border border-slate-200 rounded-lg max-w-4xl">
        <table class="min-w-full text-sm text-left" id="table-analytics">
          <thead class="bg-slate-50">
            <tr>
              <th class="py-3 px-4 border-b font-semibold text-slate-600">연 - 월</th>
              <th class="py-3 px-4 border-b font-semibold text-emerald-700 text-right">총 입고량</th>
              <th class="py-3 px-4 border-b font-semibold text-rose-700 text-right">총 출고량</th>
              <th class="py-3 px-4 border-b font-bold text-slate-800 text-right">순 증감</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100" id="listAnalytics">
            <!-- JS 렌더링 -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- [모달] 새 상품 등록 -->
  <div id="newProductModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md relative transform transition-all">
      <h3 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-folder-plus text-indigo-600"></i> 새 상품 마스터 등록
      </h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">카테고리</label>
          <input type="text" id="newCat" placeholder="예: 스킨부스터" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">상품명 <span class="text-rose-500">*</span></label>
          <input type="text" id="newProdName" placeholder="예: Hyper Shot" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">옵션/색상</label>
            <input type="text" id="newOpt" placeholder="예: Pink" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">단위/용량</label>
            <input type="text" id="newUnit" placeholder="예: 30ml" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">기본 입고가 (원)</label>
          <input type="number" id="newCost" value="0" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button onclick="closeNewProductModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-200 transition">취소</button>
        <button onclick="submitNewProduct()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow">DB 등록</button>
      </div>
    </div>
  </div>

  <!-- [모달] 커스텀 Alert -->
  <div id="alertModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-[60] flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm text-center">
      <div id="alertIcon" class="mb-3 text-4xl"></div>
      <h3 id="alertTitle" class="font-bold text-lg mb-2 text-slate-800"></h3>
      <p id="alertMessage" class="text-sm text-slate-600 mb-6 whitespace-pre-line"></p>
      <button onclick="document.getElementById('alertModal').classList.add('hidden')" class="w-full bg-indigo-600 text-white px-4 py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">확인</button>
    </div>
  </div>

  <!-- [모달] 커스텀 Confirm -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-[60] flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm">
      <h3 id="confirmTitle" class="font-bold text-lg mb-2 text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-rose-500"></i> 확인
      </h3>
      <p id="confirmMessage" class="text-sm text-slate-600 mb-6 whitespace-pre-line"></p>
      <div class="flex justify-end gap-2">
        <button onclick="closeConfirmModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-200">취소</button>
        <button id="confirmBtn" class="px-4 py-2 bg-rose-600 text-white rounded-lg text-sm font-bold hover:bg-rose-700 shadow">삭제 실행</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase 설정
    const SUPABASE_URL = 'https://rayhgqcpupwmwpymtkwg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJheWhncWNwdXB3bXdweW10a3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNjc2MTEsImV4cCI6MjA4NDg0MzYxMX0.Ng4K86amltnarVwbQ8FVfw1rTJK03NTE5g3QDoLMFTc';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let catalogData = [];     // 마스터 데이터
    let transactionsData = [];// 수불부 데이터
    let confirmCallback = null; // Confirm 모달 콜백

    // 커스텀 모달 함수 (alert 대용)
    function showCustomAlert(title, message, type = 'info') {
      document.getElementById('alertTitle').textContent = title;
      document.getElementById('alertMessage').textContent = message;
      
      const icon = document.getElementById('alertIcon');
      if(type === 'success') icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
      else if(type === 'error') icon.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-500"></i>';
      else icon.innerHTML = '<i class="fa-solid fa-circle-info text-indigo-500"></i>';

      document.getElementById('alertModal').classList.remove('hidden');
    }

    // 커스텀 컨펌 모달 (confirm 대용)
    function showCustomConfirm(title, message, callback) {
      document.getElementById('confirmTitle').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i> ${title}`;
      document.getElementById('confirmMessage').textContent = message;
      confirmCallback = callback;
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.add('hidden');
      confirmCallback = null;
    }

    document.getElementById('confirmBtn').addEventListener('click', () => {
      if(confirmCallback) confirmCallback();
      closeConfirmModal();
    });

    // 초기화
    async function init() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('txDate').value = today;
      const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
      document.getElementById('filterStartDate').value = firstDay;
      document.getElementById('filterEndDate').value = today;

      await loadData();
    }

    // 데이터 로드
    async function loadData() {
      try {
        const dbStatus = document.getElementById('db-status');
        dbStatus.className = "text-xs font-semibold px-2 py-1 rounded bg-amber-100 text-amber-700";
        dbStatus.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> 동기화 중...';

        const { data: catalog, error: catErr } = await supabaseClient
          .from('form_catalog_master')
          .select('id, product_name, category, product_option, unit, production_cost')
          .order('product_name', { ascending: true });
        if (catErr) throw catErr;
        catalogData = catalog || [];

        const { data: tx, error: txErr } = await supabaseClient
          .from('inventory_transactions')
          .select('*')
          .order('transaction_date', { ascending: false })
          .order('created_at', { ascending: false });
        if (txErr) throw txErr;
        transactionsData = tx || [];

        populateProductSelect();
        renderTransactionsTable();
        renderDashboardSummary();
        renderInventoryTable();
        renderAnalyticsTable();

        dbStatus.className = "text-xs font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-700";
        dbStatus.innerHTML = '<i class="fa-solid fa-link mr-1"></i> DB 연결됨';
      } catch (err) {
        console.error(err);
        document.getElementById('db-status').className = "text-xs font-semibold px-2 py-1 rounded bg-rose-100 text-rose-700";
        document.getElementById('db-status').innerHTML = '<i class="fa-solid fa-link-slash mr-1"></i> 연결 오류';
        showCustomAlert('DB 로드 오류', err.message, 'error');
      }
    }

    // 상품 선택 렌더링
    function populateProductSelect() {
      const select = document.getElementById('productSelect');
      const prevVal = select.value;
      select.innerHTML = '<option value="">-- 상품명 선택 --</option>';
      
      const uniqueProducts = new Set();
      catalogData.forEach(item => {
        if (!item.product_name) return;
        if (!uniqueProducts.has(item.product_name)) {
          uniqueProducts.add(item.product_name);
          const opt = document.createElement('option');
          opt.value = item.product_name;
          opt.textContent = `[${item.category || '미분류'}] ${item.product_name}`;
          select.appendChild(opt);
        }
      });
      if(prevVal) select.value = prevVal;
      updateOptionSelect();
    }

    // 옵션 렌더링
    function updateOptionSelect() {
      const productName = document.getElementById('productSelect').value;
      const optSelect = document.getElementById('optionSelect');
      optSelect.innerHTML = '<option value="">-- 옵션을 선택하세요 --</option>';
      
      if (!productName) {
        document.getElementById('txInPrice').value = '';
        return;
      }

      const filtered = catalogData.filter(item => item.product_name === productName);
      filtered.forEach(item => {
        const optionEl = document.createElement('option');
        optionEl.value = item.id; 
        const optText = item.product_option ? `색상: ${item.product_option}` : '';
        const unitText = item.unit ? `용량: ${item.unit}` : '';
        const display = [optText, unitText].filter(Boolean).join(' / ') || '기본 옵션';
        optionEl.textContent = display;
        optSelect.appendChild(optionEl);
      });
    }

    function onOptionSelectChange() {
      const selectedId = document.getElementById('optionSelect').value;
      const txType = document.getElementById('txType').value;
      if (selectedId && txType === 'IN') {
        const item = catalogData.find(c => c.id === selectedId);
        if (item) document.getElementById('txInPrice').value = item.production_cost || 0;
      }
    }

    // UI 토글 (입고/출고)
    function setTxType(type) {
      document.getElementById('txType').value = type;
      const btnIn = document.getElementById('btnTypeIn');
      const btnOut = document.getElementById('btnTypeOut');
      const wrapInLoc = document.getElementById('wrapLocationIn');
      const wrapOutLoc = document.getElementById('wrapLocationOut');
      const wrapInPrice = document.getElementById('wrapPriceIn');
      const wrapOutPrice = document.getElementById('wrapPriceOut');

      if (type === 'IN') {
        btnIn.className = "flex-1 py-2.5 border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-bold rounded-lg transition";
        btnOut.className = "flex-1 py-2.5 border-2 border-slate-200 text-slate-500 font-bold rounded-lg transition hover:bg-slate-50";
        wrapInLoc.classList.remove('hidden');
        wrapOutLoc.classList.add('hidden');
        wrapInPrice.classList.remove('hidden');
        wrapOutPrice.classList.add('hidden');
        
        document.getElementById('txOutLocation').value = '';
        document.getElementById('txOutPrice').value = '';
        onOptionSelectChange();
      } else {
        btnIn.className = "flex-1 py-2.5 border-2 border-slate-200 text-slate-500 font-bold rounded-lg transition hover:bg-slate-50";
        btnOut.className = "flex-1 py-2.5 border-2 border-rose-500 bg-rose-50 text-rose-700 font-bold rounded-lg transition";
        wrapInLoc.classList.add('hidden');
        wrapOutLoc.classList.remove('hidden');
        wrapInPrice.classList.add('hidden');
        wrapOutPrice.classList.remove('hidden');
        
        document.getElementById('txInLocation').value = '';
        document.getElementById('txInPrice').value = '';
      }
    }

    // 입출고 저장
    async function saveTransaction(e) {
      e.preventDefault();
      
      const type = document.getElementById('txType').value;
      const date = document.getElementById('txDate').value;
      const productId = document.getElementById('optionSelect').value;
      const qty = parseInt(document.getElementById('txQty').value, 10);
      const memo = document.getElementById('txMemo').value;

      if (!productId) return showCustomAlert('입력 오류', '상품과 옵션을 정확히 선택해주세요.', 'error');

      if (type === 'OUT') {
        const currentStock = calculateCurrentStock(productId);
        if (qty > currentStock) {
          return showCustomAlert('출고 불가', `현재고가 부족합니다!\n현재 해당 옵션의 재고: ${currentStock}개`, 'error');
        }
      }

      const payload = {
        transaction_date: date,
        transaction_type: type,
        product_id: productId, // uuid (foreign key)
        qty: qty,
        memo: memo,
        in_location: type === 'IN' ? document.getElementById('txInLocation').value : null,
        out_location: type === 'OUT' ? document.getElementById('txOutLocation').value : null,
        in_price: type === 'IN' ? Number(document.getElementById('txInPrice').value || 0) : 0,
        out_price: type === 'OUT' ? Number(document.getElementById('txOutPrice').value || 0) : 0
      };

      try {
        const { error } = await supabaseClient.from('inventory_transactions').insert([payload]);
        if (error) throw error;
        
        showCustomAlert('저장 성공', '입출고 내역이 성공적으로 DB에 저장되었습니다.', 'success');
        document.getElementById('txQty').value = 1;
        document.getElementById('txMemo').value = '';
        await loadData();
      } catch (err) {
        showCustomAlert('저장 실패', err.message, 'error');
      }
    }

    // 삭제 처리
    function deleteTx(id) {
      showCustomConfirm('기록 삭제', '정말 이 입출고 기록을 삭제하시겠습니까?\n삭제 시 재고 수량이 재계산됩니다.', async () => {
        try {
          const { error } = await supabaseClient.from('inventory_transactions').delete().eq('id', id);
          if(error) throw error;
          await loadData();
        } catch (err) {
          showCustomAlert('삭제 실패', err.message, 'error');
        }
      });
    }

    // 새 상품 모달 열기/닫기
    function openNewProductModal() {
      document.getElementById('newProductModal').classList.remove('hidden');
    }
    function closeNewProductModal() {
      document.getElementById('newProductModal').classList.add('hidden');
      document.getElementById('newCat').value = '';
      document.getElementById('newProdName').value = '';
      document.getElementById('newOpt').value = '';
      document.getElementById('newUnit').value = '';
      document.getElementById('newCost').value = '0';
    }

    // 새 상품 DB 저장 (Insert + Select ID)
    async function submitNewProduct() {
      const name = document.getElementById('newProdName').value.trim();
      const cat = document.getElementById('newCat').value.trim();
      const opt = document.getElementById('newOpt').value.trim();
      const unit = document.getElementById('newUnit').value.trim();
      const cost = document.getElementById('newCost').value || 0;

      if (!name) return showCustomAlert('입력 확인', '상품명은 필수 입력 항목입니다.', 'error');

      try {
        const { data, error } = await supabaseClient
          .from('form_catalog_master')
          .insert([{ 
            product_name: name, 
            category: cat, 
            product_option: opt, 
            unit: unit, 
            production_cost: Number(cost) 
          }])
          .select();
        
        if (error) throw error;
        
        if (data && data.length > 0) {
          const newProduct = data[0];
          catalogData.push(newProduct);
          
          populateProductSelect(); 
          
          // 방금 생성한 항목 자동 선택
          const pSelect = document.getElementById('productSelect');
          pSelect.value = newProduct.product_name;
          updateOptionSelect();
          const oSelect = document.getElementById('optionSelect');
          oSelect.value = newProduct.id;
          onOptionSelectChange();
          
          closeNewProductModal();
          showCustomAlert('상품 등록', '마스터 등록 완료!\n이제 바로 입출고를 진행할 수 있습니다.', 'success');
        }
      } catch (err) {
        showCustomAlert('등록 실패', err.message, 'error');
      }
    }

    // 유틸
    function getProductInfo(uuid) {
      return catalogData.find(c => c.id === uuid) || { product_name: '삭제된 상품', category: '알수없음' };
    }
    function calculateCurrentStock(uuid) {
      return transactionsData
        .filter(t => t.product_id === uuid)
        .reduce((sum, t) => sum + (t.transaction_type === 'IN' ? t.qty : -t.qty), 0);
    }

    // 테이블 렌더링
    function renderTransactionsTable() {
      const tbody = document.getElementById('listTransactions');
      tbody.innerHTML = '';
      
      if(transactionsData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-10 text-slate-400">등록된 내역이 없습니다.</td></tr>';
        return;
      }

      transactionsData.forEach(tx => {
        const prod = getProductInfo(tx.product_id);
        const nameDisp = `<span class="text-xs text-slate-400 block mb-0.5">[${prod.category || '미분류'}]</span><span class="font-bold">${prod.product_name}</span>`;
        const optDisp = [prod.product_option, prod.unit].filter(Boolean).join(' / ');
        const locDisp = tx.transaction_type === 'IN' ? tx.in_location : tx.out_location;
        const qtyHtml = tx.transaction_type === 'IN' 
          ? `<span class="text-emerald-600 font-bold">+${tx.qty.toLocaleString()}</span>` 
          : `<span class="text-rose-500 font-bold">-${tx.qty.toLocaleString()}</span>`;
        const typeBadge = tx.transaction_type === 'IN' 
          ? `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded font-semibold text-xs border border-emerald-200">입고</span>` 
          : `<span class="bg-rose-100 text-rose-700 px-2.5 py-1 rounded font-semibold text-xs border border-rose-200">출고</span>`;

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 border-b text-slate-600 whitespace-nowrap">${tx.transaction_date}</td>
            <td class="py-3 px-4 border-b">${typeBadge}</td>
            <td class="py-3 px-4 border-b text-slate-800">${nameDisp}</td>
            <td class="py-3 px-4 border-b text-slate-600">${optDisp || '-'}</td>
            <td class="py-3 px-4 border-b text-slate-600">${locDisp || '-'}</td>
            <td class="py-3 px-4 border-b text-right">${qtyHtml}</td>
            <td class="py-3 px-4 border-b text-center">
              <button onclick="deleteTx('${tx.id}')" class="text-rose-400 hover:text-rose-600 transition p-1" title="삭제">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }

    function renderDashboardSummary() {
      const currentMonth = new Date().toISOString().slice(0,7);
      const totalProducts = catalogData.length;
      let totalStock = 0, monthIn = 0, monthOut = 0;

      transactionsData.forEach(t => {
        if(t.transaction_type === 'IN') totalStock += t.qty;
        else totalStock -= t.qty;
        if(t.transaction_date.startsWith(currentMonth)) {
          if(t.transaction_type === 'IN') monthIn += t.qty;
          else monthOut += t.qty;
        }
      });

      document.getElementById('summary-cards').innerHTML = `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div><p class="text-xs text-slate-500 font-semibold mb-1">총 등록 마스터</p><h3 class="text-2xl font-bold text-slate-800">${totalProducts.toLocaleString()} <span class="text-sm font-normal text-slate-400">종</span></h3></div>
          <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-lg"><i class="fa-solid fa-box-open"></i></div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div><p class="text-xs text-slate-500 font-semibold mb-1">전체 현재고</p><h3 class="text-2xl font-bold text-indigo-700">${totalStock.toLocaleString()} <span class="text-sm font-normal text-indigo-300">개</span></h3></div>
          <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 text-lg"><i class="fa-solid fa-cubes"></i></div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div><p class="text-xs text-slate-500 font-semibold mb-1">이번 달 총 입고</p><h3 class="text-2xl font-bold text-emerald-600">${monthIn.toLocaleString()} <span class="text-sm font-normal text-emerald-300">개</span></h3></div>
          <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 text-lg"><i class="fa-solid fa-arrow-turn-down"></i></div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div><p class="text-xs text-slate-500 font-semibold mb-1">이번 달 총 출고</p><h3 class="text-2xl font-bold text-rose-600">${monthOut.toLocaleString()} <span class="text-sm font-normal text-rose-300">개</span></h3></div>
          <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center text-rose-600 text-lg"><i class="fa-solid fa-arrow-turn-up"></i></div>
        </div>
      `;
    }

    function renderInventoryTable() {
      const sDate = document.getElementById('filterStartDate').value;
      const eDate = document.getElementById('filterEndDate').value;
      const tbody = document.getElementById('listInventory');
      tbody.innerHTML = '';

      const stats = {};
      catalogData.forEach(c => {
        stats[c.id] = { startQty: 0, inQty: 0, outQty: 0, endQty: 0, ...c };
      });

      transactionsData.forEach(tx => {
        if (!stats[tx.product_id]) return; 
        const tDate = tx.transaction_date;
        const qty = tx.qty;
        const isIN = tx.transaction_type === 'IN';

        if (tDate < sDate) {
          stats[tx.product_id].startQty += (isIN ? qty : -qty);
        } else if (tDate >= sDate && tDate <= eDate) {
          if (isIN) stats[tx.product_id].inQty += qty;
          else stats[tx.product_id].outQty += qty;
        }
      });

      let html = '';
      Object.values(stats).forEach(item => {
        item.endQty = item.startQty + item.inQty - item.outQty;
        if (item.startQty === 0 && item.inQty === 0 && item.outQty === 0) return; 

        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 border-b text-slate-500 text-xs">${item.category || '-'}</td>
            <td class="py-3 px-4 border-b font-bold text-slate-800">${item.product_name}</td>
            <td class="py-3 px-4 border-b text-slate-600">${item.product_option || '-'}</td>
            <td class="py-3 px-4 border-b text-slate-600">${item.unit || '-'}</td>
            <td class="py-3 px-4 border-b text-right text-slate-500 font-medium">${item.startQty.toLocaleString()}</td>
            <td class="py-3 px-4 border-b text-right text-emerald-600 font-bold">${item.inQty.toLocaleString()}</td>
            <td class="py-3 px-4 border-b text-right text-rose-500 font-bold">${item.outQty.toLocaleString()}</td>
            <td class="py-3 px-4 border-b text-right font-bold text-indigo-700 bg-indigo-50/50">${item.endQty.toLocaleString()}</td>
          </tr>
        `;
      });
      if(html === '') html = '<tr><td colspan="8" class="text-center py-10 text-slate-400">조건에 맞는 데이터가 없습니다.</td></tr>';
      tbody.innerHTML = html;
    }

    function renderAnalyticsTable() {
      const tbody = document.getElementById('listAnalytics');
      tbody.innerHTML = '';
      
      const monthly = {};
      transactionsData.forEach(tx => {
        const ym = tx.transaction_date.slice(0,7);
        if(!monthly[ym]) monthly[ym] = { in: 0, out: 0 };
        if(tx.transaction_type === 'IN') monthly[ym].in += tx.qty;
        else monthly[ym].out += tx.qty;
      });

      const sortedKeys = Object.keys(monthly).sort().reverse();
      let html = '';
      sortedKeys.forEach(ym => {
        const stat = monthly[ym];
        const diff = stat.in - stat.out;
        const diffHtml = diff > 0 
          ? `<span class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded">+${diff.toLocaleString()}</span>` 
          : (diff < 0 ? `<span class="text-rose-500 bg-rose-50 px-2 py-1 rounded">${diff.toLocaleString()}</span>` : `<span class="text-slate-400">0</span>`);

        html += `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-4 px-4 border-b font-bold text-slate-700"><i class="fa-regular fa-calendar text-slate-400 mr-2"></i>${ym}</td>
            <td class="py-4 px-4 border-b text-right text-emerald-600 font-semibold">${stat.in.toLocaleString()}</td>
            <td class="py-4 px-4 border-b text-right text-rose-500 font-semibold">${stat.out.toLocaleString()}</td>
            <td class="py-4 px-4 border-b text-right font-bold">${diffHtml}</td>
          </tr>
        `;
      });
      if(html === '') html = '<tr><td colspan="4" class="text-center py-10 text-slate-400">분석할 데이터가 없습니다.</td></tr>';
      tbody.innerHTML = html;
    }

    // 탭 제어
    function switchTab(tabId, btnEl) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('active', 'border-indigo-600', 'text-indigo-600');
        el.classList.add('border-transparent');
      });
      document.getElementById(tabId).classList.add('active');
      btnEl.classList.add('active', 'border-indigo-600', 'text-indigo-600');
      btnEl.classList.remove('border-transparent');

      if(tabId === 'tab-inventory') renderInventoryTable();
      if(tabId === 'tab-analytics') renderAnalyticsTable();
    }

    // 엑셀 내보내기
    function exportToExcel() {
      let tableId = '';
      if(document.getElementById('tab-dashboard').classList.contains('active')) tableId = 'table-transactions';
      else if(document.getElementById('tab-inventory').classList.contains('active')) tableId = 'table-inventory';
      else if(document.getElementById('tab-analytics').classList.contains('active')) tableId = 'table-analytics';

      if(!tableId) return;
      const wb = XLSX.utils.table_to_book(document.getElementById(tableId), {sheet:"Sheet1"});
      XLSX.writeFile(wb, `재고리포트_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // 초기화 실행
    window.onload = init;
  </script>
</body>
</html>

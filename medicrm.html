<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)힘 CRM 시스템</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const Icon = ({ name, size = 24, className = "" }) => {
            const svgRef = React.useRef(null);
            React.useEffect(() => {
                if (svgRef.current && lucide.icons[name]) {
                    const iconNode = lucide.icons[name];
                    const svgString = `<svg class="lucide lucide-${name} ${className}" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconNode.map(node => `<${node[0]} ${Object.entries(node[1]).map(([k, v]) => `${k}="${v}"`).join(' ')}></${node[0]}>`).join('')}</svg>`;
                    svgRef.current.innerHTML = svgString;
                }
            }, [name, size, className]);
            return <span ref={svgRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = 'https://mfnzqerkzsvdsaszuwil.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mbnpxZXJrenN2ZHNhc3p1d2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTc0NjgsImV4cCI6MjA5NjU5MzQ2OH0.i9tSTw8r8plr7JTcTFg54bzIGw8XipNSsddx14MhznY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 거래처 구분 항목에 '일반/기타' 항목 추가
        const ACCOUNT_CATEGORIES = {
            HOSPITAL: ['병의원', '체인병의원', '병의원 도매', '병의원 온라인 도매'],
            PHARMACY: ['일반약국', '체인약국', '창고형 약국', '약국 도매', '약국 온라인 도매'],
            GENERAL: ['일반기업', '기타 화장품 도매', '기타']
        };

        const REGIONS = ['서울', '경기', '인천', '부산', '대구', '광주', '대전', '울산', '세종', '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주'];
        const PAYMENT_METHODS = ['세금계산서-계좌입금', '카드결제', '도매 결제', '체인 온라인 결제', '메디팹 결제'];

        function App() {
            const [user, setUser] = useState(null); 
            const [appUser, setAppUser] = useState(null); 
            const [authChecking, setAuthChecking] = useState(true);
            
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [rememberId, setRememberId] = useState(false);
            const [keepLoggedIn, setKeepLoggedIn] = useState(true);
            const [authError, setAuthError] = useState('');

            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [accounts, setAccounts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [visits, setVisits] = useState([]);

            const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [editingTransaction, setEditingTransaction] = useState(null);
            const [printTransaction, setPrintTransaction] = useState(null);
            const [selectedAccount, setSelectedAccount] = useState(null);
            const [isEditingAccount, setIsEditingAccount] = useState(false);
            
            const [selectedSource, setSelectedSource] = useState('온라인 검색');
            const [transactionFilter, setTransactionFilter] = useState('all');
            const [receivableFilter, setReceivableFilter] = useState('all');
            const [receivableRegionFilter, setReceivableRegionFilter] = useState('all');
            const [dbError, setDbError] = useState(''); 

            const [expandedGroups, setExpandedGroups] = useState([]); 
            const [revealedPhones, setRevealedPhones] = useState([]);

            const [txItems, setTxItems] = useState([{ name: '', qty: 1, price: 0 }]);
            const [txPromos, setTxPromos] = useState({ fixture: false, wobbler: false, poster: false, stand: false });

            const [events, setEvents] = useState([]);
            const [currentCalDate, setCurrentCalDate] = useState(new Date());
            const [isEventModalOpen, setIsEventModalOpen] = useState(false);
            const [selectedCalDate, setSelectedCalDate] = useState('');
            const [editingEvent, setEditingEvent] = useState(null); // 일정 수정 상태

            const [usersList, setUsersList] = useState([]); // 담당자(사용자) 목록
            const [productsList, setProductsList] = useState([]); // 품목 목록

            // Visit states (방문일정)
            const [isVisitModalOpen, setIsVisitModalOpen] = useState(false);
            const [editingVisit, setEditingVisit] = useState(null);
            const [visitAccountId, setVisitAccountId] = useState('');

            // Custom Alerts & Confirms
            const [alertMsg, setAlertMsg] = useState('');
            const [confirmDialog, setConfirmDialog] = useState(null);

            const getAccountDraft = () => {
                try { return JSON.parse(localStorage.getItem('hym_account_draft')) || {}; } 
                catch { return {}; }
            };
            const currentDraft = useMemo(() => isAccountModalOpen ? getAccountDraft() : {}, [isAccountModalOpen]);

            useEffect(() => {
                const checkSession = async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        setUser(session.user);
                        fetchAppUser(session.user.email);
                    } else {
                        const savedEmail = localStorage.getItem('hym_remembered_email');
                        if(savedEmail) { setLoginEmail(savedEmail); setRememberId(true); }
                        setAuthChecking(false);
                    }
                };
                checkSession();

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) { setUser(session.user); fetchAppUser(session.user.email); } 
                    else { setUser(null); setAppUser(null); }
                });
                return () => subscription.unsubscribe();
            }, []);

            const fetchAppUser = async (email) => {
                try {
                    const { data, error } = await supabase.from('hym_users').select('*').eq('email', email).single();
                    if (data) setAppUser(data);
                    else setAppUser({ email: email, name: email.split('@')[0], phone: '' });
                } catch (e) { console.error(e); } 
                finally { setAuthChecking(false); }
            };

            const loadData = async () => {
                if (!user) return;
                try {
                    const [accRes, txRes, visRes, evtRes, userRes, prodRes] = await Promise.all([
                        supabase.from('accounts').select('*').order('created_at', { ascending: false }),
                        supabase.from('transactions').select('*').order('date', { ascending: false }),
                        supabase.from('visits').select('*').order('date', { ascending: false }),
                        supabase.from('calendar_events').select('*').order('date', { ascending: false }),
                        supabase.from('hym_users').select('*'),
                        supabase.from('products').select('*')
                    ]);
                    if(accRes.data) setAccounts(accRes.data);
                    if(txRes.data) setTransactions(txRes.data);
                    if(visRes.data) setVisits(visRes.data);
                    if(evtRes.data) setEvents(evtRes.data);
                    if(userRes.data) setUsersList(userRes.data);
                    if(prodRes.data) setProductsList(prodRes.data);
                } catch (err) { console.error("데이터 로딩 오류:", err); }
            };

            useEffect(() => { loadData(); }, [user]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email: loginEmail, password: loginPassword });
                    if (error) throw error;
                    
                    if (rememberId) localStorage.setItem('hym_remembered_email', loginEmail);
                    else localStorage.removeItem('hym_remembered_email');
                } catch (err) {
                    if (err.message.includes('Invalid login credentials')) setAuthError('이메일 또는 비밀번호가 일치하지 않습니다.');
                    else if (err.message.includes('Email not confirmed')) setAuthError('이메일 인증이 필요합니다. (Supabase 설정 확인)');
                    else setAuthError('로그인 오류: ' + err.message);
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                if (!rememberId) setLoginEmail('');
                setLoginPassword('');
                sessionStorage.removeItem('hym_active_tab');
            };

            const isAdmin = appUser?.email === 'wjshin2450@gmail.com';

            const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(amount || 0);

            const extractRegion = (address) => {
                if (!address) return '미입력/기타';
                for (const region of REGIONS) {
                    if (address.includes(region) || 
                       (region === '서울' && address.includes('서울특별시')) ||
                       (region === '경기' && address.includes('경기도')) ||
                       (region === '제주' && address.includes('제주특별자치도'))) return region;
                }
                return '미입력/기타';
            };

            const extractSubRegion = (address) => {
                if (!address) return '기타';
                const parts = address.trim().split(/\s+/);
                if (parts.length < 2) return '기타';
                let sub = parts[1];
                // 시+구 형태인 경우 합쳐서 추출 (예: 수원시 영통구)
                if (parts.length > 2 && parts[1].endsWith('시') && parts[2].endsWith('구')) {
                    sub = parts[1] + ' ' + parts[2];
                }
                return sub;
            };

            const toggleGroup = (groupId) => {
                setExpandedGroups(prev => prev.includes(groupId) ? prev.filter(id => id !== groupId) : [...prev, groupId]);
            };

            const expandAllGroups = () => {
                const allIds = [];
                ['리드', '잠재고객', '거래개시', '미분류'].forEach(stage => {
                    REGIONS.concat(['미입력/기타']).forEach(reg => allIds.push(`${stage}-${reg}`));
                });
                setExpandedGroups(allIds);
            };

            const parseTxTitle = (titleStr, fallbackAmount) => {
                try {
                    const parsed = JSON.parse(titleStr);
                    if (parsed.summary) return parsed;
                    return { summary: titleStr, items: [{ name: titleStr, qty: 1, price: fallbackAmount || 0 }], promos: {} };
                } catch (e) {
                    return { summary: titleStr, items: [{ name: titleStr, qty: 1, price: fallbackAmount || 0 }], promos: {} };
                }
            };

            const handleDraftInput = (e) => {
                if(!e.currentTarget) return;
                const formData = new FormData(e.currentTarget);
                const draft = Object.fromEntries(formData.entries());
                localStorage.setItem('hym_account_draft', JSON.stringify(draft));
            };

            const handleAddAccount = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                setDbError(''); 
                const formData = new FormData(e.target);
                
                const promoMaterials = ['매대', '집기', 'RRP', '와블러', '포스터', '테스터']
                    .filter(item => formData.get(`promo_${item}`) === 'on').join(', ');
                const hasDpPhoto = formData.get('hasDpPhoto') === 'on' ? 'true' : 'false';

                const newAccount = {
                    name: formData.get('name'), type: formData.get('type'), contact: formData.get('contact'),
                    phone: formData.get('phone'), email: formData.get('email'), address: formData.get('address'),
                    "collectionDay": formData.get('collectionDay'), "paymentMethod": formData.get('paymentMethod'),
                    "salesRepName": formData.get('salesRepName'), "salesRepPhone": formData.get('salesRepPhone'),
                    stage: formData.get('stage'), source: formData.get('source'), "sourceDetail": formData.get('sourceDetail') || '',
                    "meetDate": formData.get('meetDate') || '', "firstTradeDate": formData.get('firstTradeDate') || '',
                    "lastTradeDate": formData.get('firstTradeDate') || '', "collectionPlanDate": '', receivable: 0,
                    "orderMethod": formData.get('orderMethod'), "hasDpPhoto": hasDpPhoto, "promoMaterials": promoMaterials
                };
                try {
                    const { error } = await supabase.from('accounts').insert([newAccount]);
                    if (error) throw error; 

                    if (appUser && appUser.email) {
                        const updatedName = formData.get('salesRepName');
                        const updatedPhone = formData.get('salesRepPhone');
                        await supabase.from('hym_users').update({ name: updatedName, phone: updatedPhone }).eq('email', appUser.email);
                        setAppUser(prev => ({...prev, name: updatedName, phone: updatedPhone}));
                    }

                    localStorage.removeItem('hym_account_draft');
                    setIsAccountModalOpen(false);
                    loadData();
                } catch (err) { setDbError('저장 실패: ' + (err.message || '알 수 없는 오류')); }
            };

            const handleUpdateAccount = async (e) => {
                e.preventDefault();
                if (!isAdmin || !selectedAccount) return;
                setDbError('');
                const formData = new FormData(e.target);

                const promoMaterials = ['매대', '집기', 'RRP', '와블러', '포스터', '테스터']
                    .filter(item => formData.get(`promo_${item}`) === 'on').join(', ');
                const hasDpPhoto = formData.get('hasDpPhoto') === 'on' ? 'true' : 'false';

                const updatedData = {
                    name: formData.get('name'), type: formData.get('type'), contact: formData.get('contact'),
                    phone: formData.get('phone'), email: formData.get('email'), address: formData.get('address'),
                    "collectionDay": formData.get('collectionDay'), "paymentMethod": formData.get('paymentMethod'),
                    "salesRepName": formData.get('salesRepName'), "salesRepPhone": formData.get('salesRepPhone'),
                    stage: formData.get('stage'), source: formData.get('source'), "sourceDetail": formData.get('sourceDetail') || '',
                    "meetDate": formData.get('meetDate') || '', "firstTradeDate": formData.get('firstTradeDate') || '',
                    "orderMethod": formData.get('orderMethod'), "hasDpPhoto": hasDpPhoto, "promoMaterials": promoMaterials
                };
                try {
                    const { error } = await supabase.from('accounts').update(updatedData).eq('id', selectedAccount.id);
                    if (error) throw error;
                    setIsEditingAccount(false);
                    setSelectedAccount({...selectedAccount, ...updatedData});
                    loadData();
                } catch (err) { setDbError('수정 실패: ' + (err.message || '알 수 없는 오류')); }
            };

            const handleTransactionSubmit = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                const formData = new FormData(e.target);
                const accountId = formData.get('accountId');
                
                if (txItems.length === 0 || !txItems[0].name) {
                    setAlertMsg('최소 1개의 품목을 입력해주세요.'); return;
                }
                const txTotalAmount = txItems.reduce((sum, item) => sum + (Number(item.qty) * Number(item.price)), 0);
                const summaryName = txItems.length > 1 ? `${txItems[0].name} 외 ${txItems.length - 1}건` : txItems[0].name;
                
                const complexTitle = JSON.stringify({ summary: summaryName, items: txItems, promos: txPromos });
                
                try {
                    if (editingTransaction) {
                        const { error: txError } = await supabase.from('transactions').update({
                            "accountId": accountId, date: formData.get('date'), title: complexTitle, 
                            amount: txTotalAmount, "paymentMethod": formData.get('paymentMethod')
                        }).eq('id', editingTransaction.id);
                        if (txError) throw txError;
                        
                        if (editingTransaction.accountId === accountId) {
                            const diffAmount = txTotalAmount - editingTransaction.amount;
                            if (diffAmount !== 0) {
                                const targetAccount = accounts.find(a => a.id === accountId);
                                if (targetAccount) {
                                    await supabase.from('accounts').update({
                                        receivable: (Number(targetAccount.receivable) || 0) + diffAmount
                                    }).eq('id', accountId);
                                }
                            }
                        } else {
                            const oldAccount = accounts.find(a => a.id === editingTransaction.accountId);
                            const newAccount = accounts.find(a => a.id === accountId);
                            if (oldAccount) await supabase.from('accounts').update({ receivable: (Number(oldAccount.receivable) || 0) - editingTransaction.amount }).eq('id', editingTransaction.accountId);
                            if (newAccount) await supabase.from('accounts').update({ receivable: (Number(newAccount.receivable) || 0) + txTotalAmount }).eq('id', accountId);
                        }
                    } else {
                        const newTransaction = {
                            "accountId": accountId, date: formData.get('date'), title: complexTitle, amount: txTotalAmount,
                            status: '청구됨', "paymentMethod": formData.get('paymentMethod')
                        };
                        const { error: txError } = await supabase.from('transactions').insert([newTransaction]);
                        if (txError) throw txError;
                        
                        const targetAccount = accounts.find(a => a.id === accountId);
                        if (targetAccount) {
                            await supabase.from('accounts').update({
                                receivable: (Number(targetAccount.receivable) || 0) + txTotalAmount,
                                "lastTradeDate": formData.get('date'), stage: '거래개시' 
                            }).eq('id', accountId);
                        }
                    }
                    
                    try {
                        const upsertProducts = txItems.map(item => ({ name: item.name, price: Number(item.price) }));
                        if (upsertProducts.length > 0) {
                            await supabase.from('products').upsert(upsertProducts, { onConflict: 'name' });
                        }
                    } catch (prodErr) { console.error("품목 등록 오류", prodErr); }

                    setIsTransactionModalOpen(false);
                    setEditingTransaction(null);
                    setTxItems([{ name: '', qty: 1, price: 0 }]);
                    setTxPromos({ fixture: false, wobbler: false, poster: false, stand: false });
                    loadData();
                } catch (err) { setAlertMsg('명세서 저장에 실패했습니다.'); console.error(err); }
            };

            const openAddTransactionModal = () => {
                setEditingTransaction(null);
                setTxItems([{ name: '', qty: 1, price: 0 }]);
                setTxPromos({ fixture: false, wobbler: false, poster: false, stand: false });
                setIsTransactionModalOpen(true);
            };

            const openEditTransactionModal = (tr) => {
                setEditingTransaction(tr);
                const parsed = parseTxTitle(tr.title, tr.amount);
                setTxItems(parsed.items || [{ name: '', qty: 1, price: 0 }]);
                setTxPromos(parsed.promos || { fixture: false, wobbler: false, poster: false, stand: false });
                setIsTransactionModalOpen(true);
            };

            const handleCompleteCollection = (accountId) => {
                if (!isAdmin) return;
                setConfirmDialog({
                    message: '채권 잔액을 0원으로 만들고 관련된 모든 명세서를 수금완료로 변경하시겠습니까?\n(이 작업은 되돌릴 수 없으며 목록에서 채권이 숨겨집니다.)',
                    onConfirm: async () => {
                        try {
                            await supabase.from('accounts').update({ receivable: 0 }).eq('id', accountId);
                            await supabase.from('transactions').update({ status: '수금완료' }).eq('"accountId"', accountId);
                            loadData(); 
                            setConfirmDialog(null);
                        } catch (err) { console.error(err); setAlertMsg('수금 처리 중 오류가 발생했습니다.'); }
                    }
                });
            };

            const openAddEventModal = (dateStr) => {
                // 권한 체크 해제 (누구나 일정 추가 가능)
                setEditingEvent(null);
                setSelectedCalDate(dateStr);
                setIsEventModalOpen(true);
            };

            const openEditEventModal = (e, ev) => {
                e.stopPropagation(); 
                // 권한 체크 해제 (누구나 일정 수정 가능)
                setEditingEvent(ev);
                setSelectedCalDate(ev.date);
                setIsEventModalOpen(true);
            };

            const handleEventSubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const eventData = {
                    title: formData.get('title'),
                    type: formData.get('type'),
                    note: formData.get('note'),
                    date: formData.get('date'),
                };

                try {
                    if (editingEvent) {
                        await supabase.from('calendar_events').update(eventData).eq('id', editingEvent.id);
                    } else {
                        await supabase.from('calendar_events').insert([eventData]);
                    }
                    setIsEventModalOpen(false);
                    setEditingEvent(null);
                    loadData();
                } catch (err) { setAlertMsg('일정 저장 오류: ' + err.message); }
            };

            const handleDeleteEvent = () => {
                if (!editingEvent) return;
                setConfirmDialog({
                    message: '이 일정을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.',
                    onConfirm: async () => {
                        await supabase.from('calendar_events').delete().eq('id', editingEvent.id);
                        setIsEventModalOpen(false);
                        setEditingEvent(null);
                        setConfirmDialog(null);
                        loadData();
                    }
                });
            };

            const openAddVisitModal = (accountId) => {
                // 권한 체크 해제
                setVisitAccountId(accountId);
                setEditingVisit(null);
                setIsVisitModalOpen(true);
            };

            const openEditVisitModal = (e, visit, accountId) => {
                e.stopPropagation();
                // 권한 체크 해제
                setVisitAccountId(accountId);
                setEditingVisit(visit);
                setIsVisitModalOpen(true);
            };

            const handleVisitSubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const visitData = {
                    accountId: visitAccountId,
                    date: formData.get('date'),
                    note: formData.get('note'),
                    author: appUser?.name || '관리자'
                };
                try {
                    if (editingVisit) {
                        await supabase.from('visits').update(visitData).eq('id', editingVisit.id);
                    } else {
                        await supabase.from('visits').insert([visitData]);
                    }

                                <label className="flex items-center gap-1.5 text-sm text-slate-600 cursor-pointer"><input type="checkbox" checked={txPromos.wobbler} onChange={(e)=>setTxPromos({...txPromos, wobbler: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" /> 와블러</label>
                                <label className="flex items-center gap-1.5 text-sm text-slate-600 cursor-pointer"><input type="checkbox" checked={txPromos.poster} onChange={(e)=>setTxPromos({...txPromos, poster: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" /> 포스터</label>
                                <label className="flex items-center gap-1.5 text-sm text-slate-600 cursor-pointer"><input type="checkbox" checked={txPromos.stand} onChange={(e)=>setTxPromos({...txPromos, stand: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" /> 매대</label>
                            </div>
                        </div>

                        <div className="flex justify-end gap-2 pt-4">
                        <button type="button" onClick={() => {setIsTransactionModalOpen(false); setEditingTransaction(null);}} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50">취소</button>
                        <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700">{editingTransaction ? "수정 내용 저장" : "명세서 발행"}</button>
                        </div>
                    </form>
                    </Modal>
                )}

                {}
                {printTransaction && (
                    <div className="fixed inset-0 bg-white z-50 overflow-y-auto p-8 print:p-0">
                    <div className="max-w-4xl mx-auto space-y-6">
                        <div id="print-area" className="border-2 border-slate-800 p-8 bg-white text-slate-900 rounded-md print:border-none print:p-0">
                        <h2 className="text-2xl font-bold text-center border-b-2 border-slate-800 pb-4 mb-6 tracking-[0.5em]">거래명세서</h2>
                        <div className="flex justify-between items-start mb-8 text-sm">
                            <div className="space-y-1">
                                <p><span className="font-semibold w-24 inline-block">공급자:</span> 주식회사 힘 (HYM CORP.)</p>
                                <p><span className="font-semibold w-24 inline-block">사업자번호:</span> 130-88-03645</p>
                                <p><span className="font-semibold w-24 inline-block">대표자명:</span> 이혜윤</p>
                                <p className="flex"><span className="font-semibold w-24 shrink-0">사업자 주소:</span> <span className="max-w-[200px]">경기도 용인시 수지구 용구대로2790번길 7, 302-제이77호(죽전동, 프라임조명)</span></p>
                                <p><span className="font-semibold w-24 inline-block">Tel:</span> 010-8630-1816</p>
                            </div>
                            <div className="space-y-1 text-right">
                                {(() => {
                                    const acc = accounts.find(a => a.id === printTransaction.accountId);
                                    return (<><p><span className="font-bold text-lg">{acc?.name}</span> 귀하</p><p>담당자: {acc?.contact}</p><p>Tel: {acc?.phone}</p></>);
                                })()}
                            </div>
                        </div>
                        <div className="mb-4 flex justify-between items-end border-b border-slate-300 pb-2">
                            <div><p><span className="font-semibold">거래일자:</span> {printTransaction.date}</p><p className="text-xs text-slate-500 mt-1">결제조건: {printTransaction.paymentMethod}</p></div>
                            <p className="text-xl font-bold">청구 금액: {formatCurrency(printTransaction.amount)}</p>
                        </div>
                        {(() => {
                            const printData = parseTxTitle(printTransaction.title, printTransaction.amount);
                            const promoList = [];
                            if(printData.promos?.fixture) promoList.push('집기');
                            if(printData.promos?.wobbler) promoList.push('와블러');
                            if(printData.promos?.poster) promoList.push('포스터');
                            if(printData.promos?.stand) promoList.push('매대');

                            return (
                                <>
                                <table className="w-full text-sm border-collapse border border-slate-400 mb-4">
                                    <thead className="bg-slate-100">
                                        <tr>
                                            <th className="border border-slate-400 py-2 px-3 w-12 text-center">No.</th>
                                            <th className="border border-slate-400 py-2 px-3">품목명 (거래내용)</th>
                                            <th className="border border-slate-400 py-2 px-3 w-16 text-center">수량</th>
                                            <th className="border border-slate-400 py-2 px-3 w-28 text-right">단가(공급가)</th>
                                            <th className="border border-slate-400 py-2 px-3 w-32 text-right">합계액</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {printData.items.map((item, idx) => (
                                            <tr key={idx}>
                                                <td className="border border-slate-400 py-3 px-3 text-center">{idx + 1}</td>
                                                <td className="border border-slate-400 py-3 px-3">{item.name}</td>
                                                <td className="border border-slate-400 py-3 px-3 text-center">{item.qty}</td>
                                                <td className="border border-slate-400 py-3 px-3 text-right">{formatCurrency(item.price)}</td>
                                                <td className="border border-slate-400 py-3 px-3 text-right">{formatCurrency(item.qty * item.price)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {promoList.length > 0 && (
                                    <div className="mb-8 p-3 bg-slate-50 border border-slate-300 text-sm rounded shadow-sm">
                                        <span className="font-semibold text-slate-800">※ 무상 지원 물품 (판촉/집기): </span>
                                        <span className="text-blue-700 font-medium">{promoList.join(', ')}</span>
                                    </div>
                                )}
                                </>
                            );
                        })()}
                        </div>
                        <div className="flex justify-end gap-2 pt-4 print:hidden">
                            <button onClick={() => setPrintTransaction(null)} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50">닫기</button>
                            <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium"><Icon name="Printer" size={16} /> 인쇄하기</button>
                        </div>
                    </div>
                    </div>
                )}

                {/* Event Modal (일정 추가 및 수정) */}
                {isEventModalOpen && (
                    <Modal title={editingEvent ? "일정 수정" : "새 일정 추가"} onClose={() => { setIsEventModalOpen(false); setEditingEvent(null); }}>
                        <form onSubmit={handleEventSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">일자</label>
                                <input name="date" required type="date" defaultValue={selectedCalDate} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">일정 구분</label>
                                <select name="type" required defaultValue={editingEvent?.type || "미팅"} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                                    <option value="미팅">미팅 / 방문</option>
                                    <option value="통화">중요 통화</option>
                                    <option value="개인">개인 일정</option>
                                    <option value="기타">기타</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">일정 제목 (요약)</label>
                                <input name="title" required type="text" defaultValue={editingEvent?.title || ""} placeholder="예: 00약국 원장님 미팅" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">세부 내용 (선택)</label>
                                <textarea name="note" rows="3" defaultValue={editingEvent?.note || ""} placeholder="상세 내용을 입력하세요" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                            </div>
                            
                            <div className="flex justify-between items-center pt-4 border-t border-slate-200">
                                {editingEvent ? (
                                    <button type="button" onClick={handleDeleteEvent} className="px-3 py-2 text-red-600 bg-red-50 hover:bg-red-100 rounded-md text-sm font-medium border border-red-200">삭제</button>
                                ) : <div></div>}
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => { setIsEventModalOpen(false); setEditingEvent(null); }} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 text-sm font-medium">취소</button>
                                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm font-medium">저장</button>
                                </div>
                            </div>
                        </form>
                    </Modal>
                )}

                {/* Visit Modal (방문 기록 추가 및 수정) */}
                {isVisitModalOpen && (
                    <Modal title={editingVisit ? "방문/영업 기록 수정" : "방문/영업 기록 추가"} onClose={() => { setIsVisitModalOpen(false); setEditingVisit(null); }}>
                        <form onSubmit={handleVisitSubmit} className="space-y-4">
                            {!selectedAccount && !editingVisit && (
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">거래처 선택</label>
                                    <select required value={visitAccountId} onChange={(e) => setVisitAccountId(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                                        <option value="">거래처를 선택하세요</option>
                                        {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                                    </select>
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">방문 일자</label>
                                <input name="date" required type="date" defaultValue={editingVisit?.date || new Date().toISOString().split('T')[0]} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">영업/방문 내용</label>
                                <textarea name="note" required rows="5" defaultValue={editingVisit?.note || ""} placeholder="미팅 내용, 특이사항, 다음 계획 등을 기록하세요" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                            </div>
                            
                            <div className="flex justify-between items-center pt-4 border-t border-slate-200">
                                {editingVisit ? (
                                    <button type="button" onClick={handleDeleteVisit} className="px-3 py-2 text-red-600 bg-red-50 hover:bg-red-100 rounded-md text-sm font-medium border border-red-200">삭제</button>
                                ) : <div></div>}
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => { setIsVisitModalOpen(false); setEditingVisit(null); }} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 text-sm font-medium">취소</button>
                                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 text-sm font-medium">저장</button>
                                </div>
                            </div>
                        </form>
                    </Modal>
                )}

                {/* Custom Global Modals for Alert and Confirm */}
                {alertMsg && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
                        <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm text-center">
                            <Icon name="AlertCircle" size={48} className="mx-auto text-amber-500 mb-4" />
                            <p className="text-slate-800 font-medium mb-6 whitespace-pre-wrap">{alertMsg}</p>
                            <button onClick={() => setAlertMsg('')} className="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700">확인</button>
                        </div>
                    </div>
                )}
                {confirmDialog && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
                        <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-md text-center">
                            <Icon name="AlertCircle" size={48} className="mx-auto text-amber-500 mb-4" />
                            <p className="text-slate-800 font-medium mb-6 whitespace-pre-wrap">{confirmDialog.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg font-medium hover:bg-slate-200">취소</button>
                                <button onClick={confirmDialog.onConfirm} className="flex-1 bg-red-600 text-white py-2 rounded-lg font-medium hover:bg-red-700">확인 및 실행</button>
                            </div>
                        </div>
                    </div>
                )}

                </div>
            );
        }

        function Modal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center p-5 border-b border-slate-200 bg-slate-50 shrink-0">
                    <h2 className="text-lg font-bold text-slate-800">{title}</h2>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors p-1 hover:bg-slate-200 rounded"><Icon name="X" size={20} /></button>
                    </div>
                    <div className="p-6 overflow-y-auto">{children}</div>
                </div>
                </div>
            );
        }

        function SidebarItem({ icon, label, isActive, onClick }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 ${
                        isActive ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                >
                    {icon}
                    <span className="font-medium text-sm">{label}</span>
                </button>
            );
        }

        function KpiCard({ title, amount, icon, color }) {
            return (
                <div className={`bg-white p-6 rounded-xl shadow-sm border-l-4 ${color} border-y border-r border-slate-200 flex items-center justify-between hover:shadow-md transition-shadow`}>
                    <div>
                        <h4 className="text-sm font-medium text-slate-500 mb-1">{title}</h4>
                        <div className="text-2xl font-bold text-slate-800">{amount}</div>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-full shrink-0">
                        {icon}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

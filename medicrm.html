                                    let priceKrw = null;
                                    let priceUsd = null;
                                    prices.forEach(p => {
                                        if (p.b2c_msrp != null && Number(p.b2c_msrp) > 0) {
                                            if (p.currency === 'KRW' || !p.currency) priceKrw = Number(p.b2c_msrp);
                                            else if (p.currency === 'USD') priceUsd = Number(p.b2c_msrp) * 1400;
                                        }
                                    });
                                    if (priceKrw !== null) msrp = priceKrw;
                                    else if (priceUsd !== null) msrp = priceUsd;
                                }
                            }

                            if (msrp === 0) msrp = Number(catInfo.fallbackUnitPrice) || 0;
                            if (msrp > 0 && msrp < 1000) msrp = msrp * 1400;

                            const isResnovae = product.brand && product.brand.toLowerCase() === 'resnovae';
                            const brandPart = product.brand && !isResnovae ? `[${product.brand}] ` : '';
                            let namePart = translateToKorean(product.clean_name || 'Unnamed Product').replace(/\[?resnovae\]?/gi, '').trim();
                            let fullName = `${brandPart}${namePart}`.trim();

                            if (fullName.includes('코어 임팩트') || fullName.includes('하이퍼 샷')) fullName = `[뷰티기기] ${fullName}`;

                            msrp = Math.round(msrp / 100) * 100;
                            let promoPrice = Math.round((msrp * 0.75) / 100) * 100;

                            const finalPrice = overrideSupplyPrice !== null ? overrideSupplyPrice : supplyPrice;

                            return { name: fullName, price: finalPrice };
                        }).filter(item => item.price > 0);

                if (!address) return '미입력/기타';
                for (const region of REGIONS) {
                    if (address.includes(region)) return region;
                }
                return '미입력/기타';

            const toggleGroup = (groupId) => {
                setExpandedGroups(prev => prev.includes(groupId) ? prev.filter(id => id !== groupId) : [...prev, groupId]);
            };

            // [오류 수정됨] 폴더 펼치기 ID 정확한 매핑
            const expandAllGroups = () => {
                const allIds = [];
                if (activeTab.startsWith('vendor_')) {
                    let typeLabel = '생산처';
                    
                    if (activeTab.startsWith('vendor_dom_')) {
                        const catId = activeTab.replace('vendor_dom_', '');
                        const found = VENDOR_CATEGORIES.find(c => c.id === catId);
                        if (found) typeLabel = found.name;
                    } else if (activeTab.startsWith('vendor_os_')) {
                        const parts = activeTab.split('_');
                        const catId = parts[3];
                        const found = VENDOR_CATEGORIES.find(c => c.id === catId);
                        if (found) typeLabel = found.name;
                    }

                    if (typeLabel === '호텔' || typeLabel === '골프장' || typeLabel === '음식점') {
                        const stages = ['리드', '잠재고객', '거래처', '미분류'];
                        stages.forEach(stage => {
                            if (typeLabel === '음식점') {
                                [...ACCOUNT_CATEGORIES.RESTAURANT, '미분류'].forEach(type => allIds.push(`vendor-${activeTab}-${stage}-${type}`));
                            } else {
                                [...REGIONS, '해외', '기타', '미입력/기타'].forEach(reg => allIds.push(`vendor-${activeTab}-${stage}-${reg}`));
                            }
                        });
                    } else {
                        let categories = [];
                        const categoryData = VENDOR_CATEGORIES.find(c => c.name === typeLabel);
                        if (categoryData) {
                            categories = [...categoryData.subCats, '미분류'];
                        } else {
                            categories = [...ACCOUNT_CATEGORIES.VENDOR_PRIMARY, '미분류'];
                        }
                        categories.forEach(p => allIds.push(`vendor-group-${p}`));
                    }
                } else {
                    let prefix = 'dom';
                    if (activeTab === 'group_purchase') prefix = 'gp';
                    else if (activeTab === 'home_shopping') prefix = 'hs';
                    else if (activeTab === 'retail') prefix = 'rt';
                    else if (activeTab === 'overseas') prefix = 'os';

                    ['리드', '잠재고객', '거래처', '미분류'].forEach(stage => {
                        [...REGIONS, '해외', '기타', '미입력/기타'].forEach(reg => allIds.push(`${prefix}-${stage}-${reg}`));
                    });
                }
                setExpandedGroups(allIds);

            const handleTransactionSubmit = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                const formData = new FormData(e.target);
                const accountId = formData.get('accountId');
                const txType = formData.get('txType') || 'sales'; 
                
                if (txItems.length === 0 || !txItems[0].name) {
                    setAlertMsg('최소 1개의 품목을 입력해주세요.'); return;
                }

                const subTotalAmount = txItems.reduce((sum, item) => sum + (Number(item.qty) * Number(item.price)), 0);
                const calculatedTaxAmount = isTaxApplied ? Math.floor(subTotalAmount * 0.1) : 0;
                const txTotalAmount = subTotalAmount + calculatedTaxAmount;

                const summaryName = txItems.length > 1 ? `${txItems[0].name} 외 ${txItems.length - 1}건` : txItems[0].name;
                const complexTitle = JSON.stringify({ 
                    summary: summaryName, items: txItems, promos: txPromos, 
                    isTaxApplied: isTaxApplied, taxAmount: calculatedTaxAmount,
                    memo: txMemo
                });
                
                try {
                    if (editingTransaction) {
                        const { error: txError } = await supabase.from('transactions').update({
                            "accountId": accountId, date: formData.get('date'), title: complexTitle, 
                            amount: txTotalAmount, "paymentMethod": formData.get('paymentMethod'), "txType": txType
                        }).eq('id', editingTransaction.id);

                        const { error: txError } = await supabase.from('transactions').insert([newTransaction]);

                        const targetAccount = accounts.find(a => a.id === accountId);

                            }).eq('id', accountId);

            // [오류 수정됨] 지역별 렌더링 정상 동작하는 매출처 렌더링 함수
            const renderAccountGroups = (list, cols, prefix, balanceField = 'actualReceivable') => {
                const stages = ['리드', '잠재고객', '거래처', '미분류'];
                return stages.map(stage => {
                    const stageList = list.filter(a => (a.stage === stage) || (stage === '미분류' && !['리드', '잠재고객', '거래처'].includes(a.stage)));
                    if (stageList.length === 0) return null;

                    const regions = [...REGIONS, '해외', '기타', '미입력/기타'];
                    
                    return (
                        <div key={`${prefix}-${stage}`} className="mb-6 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="bg-slate-100 px-4 py-3 border-b border-slate-200">
                                <h4 className="font-bold text-slate-800">{stage} <span className="text-blue-600">({stageList.length})</span></h4>
                            </div>
                            <div className="p-4 space-y-4">
                                {regions.map(reg => {
                                    const regList = stageList.filter(a => {
                                        const parsedReg = extractRegion(a.address);
                                        if (reg === '미입력/기타') return !REGIONS.includes(parsedReg);
                                        return parsedReg === reg;
                                    });
                                    if (regList.length === 0) return null;
                                    
                                    const groupId = `${prefix}-${stage}-${reg}`;
                                    const isExpanded = expandedGroups.includes(groupId);

                                    return (
                                        <div key={groupId} className="border border-slate-200 rounded-lg overflow-hidden">
                                            <button onClick={() => toggleGroup(groupId)} className="w-full flex justify-between items-center bg-slate-50 px-4 py-2 text-sm font-semibold hover:bg-slate-100 transition-colors">
                                                <span className="text-slate-700">{reg} <span className="text-slate-500 font-normal">({regList.length})</span></span>
                                                <Icon name="ChevronDown" size={16} className={`text-slate-400 transition-transform ${isExpanded ? 'rotate-180' : ''}`} />
                                            </button>
                                            {isExpanded && (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm text-left">
                                                        <thead className="text-xs text-slate-500 uppercase bg-white border-y border-slate-200">
                                                            <tr>
                                                                <th className="px-4 py-2">{cols.col1}</th>
                                                                <th className="px-4 py-2">{cols.col2}</th>
                                                                <th className="px-4 py-2">{cols.col3}</th>
                                                                <th className="px-4 py-2">{cols.col4}</th>
                                                                <th className="px-4 py-2 text-right">{cols.col5}</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-100">
                                                            {regList.map(acc => (
                                                                <tr key={acc.id} onClick={() => {setSelectedAccount(acc); setIsEditingAccount(false); setAccountModalTab('info');}} className="hover:bg-blue-50 cursor-pointer transition-colors bg-white">
                                                                    <td className="px-4 py-3"><div className="font-medium text-slate-900">{acc.name}</div><div className="text-xs text-slate-500">{acc.type}</div></td>
                                                                    <td className="px-4 py-3"><div className="text-slate-800">{acc.contact}</div><div className="text-xs text-slate-500">{acc.phone}</div></td>
                                                                    <td className="px-4 py-3"><div className="text-slate-800 truncate max-w-[200px]">{acc.address}</div><div className="text-xs text-slate-500 truncate max-w-[200px]">{acc.email || '-'}</div></td>
                                                                    <td className="px-4 py-3"><div className="text-slate-800">{acc.paymentMethod}</div><div className="text-xs text-slate-500">{acc.collectionDay}</div></td>
                                                                    <td className="px-4 py-3 text-right font-bold text-red-600">{formatCurrency(acc[balanceField] || acc.actualReceivable || 0)}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

            const totalReceivables = calculatedAccounts.reduce((sum, acc) => sum + acc.actualReceivable, 0);

            const dashboardSales = transactions.filter(t => t.date && t.date.startsWith(dashboardMonth) && (!t.txType || t.txType === 'sales')).reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

            const domAccs = accounts.filter(a => !ACCOUNT_CATEGORIES.GROUP_PURCHASE.includes(a.type) && (!ACCOUNT_CATEGORIES.HOME_SHOPPING || !ACCOUNT_CATEGORIES.HOME_SHOPPING.includes(a.type)) && (!ACCOUNT_CATEGORIES.RETAIL || !ACCOUNT_CATEGORIES.RETAIL.includes(a.type)) && !ACCOUNT_CATEGORIES.OVERSEAS.includes(a.type) && a.stage !== '매입처');

            const getStats = (list) => ({ total: list.length, lead: list.filter(a => a.stage === '리드').length, potential: list.filter(a => a.stage === '잠재고객').length, active: list.filter(a => a.stage === '거래개시' || a.stage === '거래처').length });
            const domStats = getStats(domAccs);

            const hsStats = getStats(hsAccs);
            const rtStats = getStats(rtAccs);
            const osStats = getStats(osAccs);

            const domHospitals = domAccs.filter(a => ACCOUNT_CATEGORIES.HOSPITAL.includes(a.type)).length;
            const domPharmacies = domAccs.filter(a => ACCOUNT_CATEGORIES.PHARMACY.includes(a.type)).length;
            const domGeneral = domAccs.length - domHospitals - domPharmacies;

            const getTypeCounts = (accs) => {
                const counts = {};
                accs.forEach(a => { const t = a.type || '미분류'; counts[t] = (counts[t] || 0) + 1; });
                return Object.entries(counts).sort((a,b) => b[1] - a[1]);
            };
            const osTypeCounts = getTypeCounts(osAccs);

            const productSales = {};
            transactions.filter(t => t.date && t.date.startsWith(dashboardMonth) && (!t.txType || t.txType === 'sales')).forEach(t => {
                const parsed = parseTxTitle(t.title, t.amount);
                if (parsed && parsed.items) {
                    parsed.items.forEach(item => {
                        if(!item.name) return;
                        if (!productSales[item.name]) productSales[item.name] = { qty: 0, totalAmount: 0 };
                        productSales[item.name].qty += Number(item.qty) || 0;
                        productSales[item.name].totalAmount += (Number(item.qty) || 0) * (Number(item.price) || 0);
                    });
                }
            });
            const topProducts = Object.entries(productSales).map(([name, data]) => ({ name, ...data })).sort((a, b) => b.totalAmount - a.totalAmount);

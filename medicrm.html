    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* [추가] 인쇄 전용 스타일: A4 가로 + 사방 여백, 내용이 용지 밖으로 잘리지 않도록 처리 */
        @page { size: A4 landscape; margin: 14mm 14mm 14mm 14mm; }
        @media print {
            html, body, #root { width: auto !important; height: auto !important; overflow: visible !important; background: #fff !important; margin: 0 !important; padding: 0 !important; }
            .app-shell { display: block !important; width: auto !important; height: auto !important; overflow: visible !important; }
            .app-shell > *:not(.print-root) { display: none !important; }
            .print-root { position: static !important; inset: auto !important; overflow: visible !important; padding: 0 !important; margin: 0 !important; z-index: auto !important; width: 100% !important; }
            .print-root > div { width: 100% !important; max-width: 100% !important; margin: 0 !important; }
            .print-root *, .print-root *::before, .print-root *::after { box-sizing: border-box !important; }
            /* 용지 안쪽으로 한 번 더 안전 여백 */
            .print-sheet { width: 100% !important; max-width: 100% !important; padding: 4mm 3mm !important; margin: 0 !important; border: none !important; border-radius: 0 !important; }
            /* 표가 용지 폭을 넘지 않도록 */
            .print-root table { width: 100% !important; max-width: 100% !important; page-break-inside: auto; }
            .print-root td, .print-root th { word-break: keep-all; overflow-wrap: anywhere; }
            .print-root tr { page-break-inside: avoid; break-inside: avoid; }
            .print-root thead { display: table-header-group; }
            .print-root tfoot { display: table-row-group; }
            .print-root .w-64, .print-root .w-72 { width: 18rem !important; }
            /* 인쇄 시 세로 간격을 살짝 줄여 거래처 1곳이 가능한 한 1장에 들어가도록 */
            .print-sheet h2 { padding-bottom: 6px !important; margin-bottom: 4px !important; font-size: 20px !important; }
            .print-sheet .mb-6 { margin-bottom: 10px !important; }
            .print-sheet .mb-8 { margin-bottom: 12px !important; }
            .print-sheet .mt-6 { margin-top: 10px !important; }
            .print-sheet .py-3 { padding-top: 6px !important; padding-bottom: 6px !important; }
            .print-sheet .py-2 { padding-top: 4px !important; padding-bottom: 4px !important; }
            .print-sheet .py-1\.5 { padding-top: 3px !important; padding-bottom: 3px !important; }
            .print-sheet .sheet-footer { break-before: avoid; page-break-before: avoid; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            /* 수정 모드 표시는 인쇄물에 나오지 않음 */
            [data-print-editable], [data-print-editable] * { outline: none !important; box-shadow: none !important; }
            .print-edit-banner { display: none !important; }
        }
        /* [추가] 발주서는 A4 세로로 인쇄 */
        @page po-portrait { size: A4 portrait; margin: 10mm 10mm 10mm 10mm; }
        @media print {
            .po-print-root .po-sheet { page: po-portrait; padding: 0 !important; font-size: 11px !important; }
            .po-print-root .po-sheet h2 { font-size: 26px !important; }
            .po-print-root img { max-width: none; }
        }
        /* [추가] 인쇄 전 수정 모드 */
        .print-edit-on [data-print-editable] { outline: 2px dashed #f59e0b; outline-offset: 6px; cursor: text; }
        .print-edit-on [data-print-editable] td:hover, .print-edit-on [data-print-editable] th:hover,
        .print-edit-on [data-print-editable] p:hover, .print-edit-on [data-print-editable] span:hover,
        .print-edit-on [data-print-editable] h2:hover { background-color: #fef9c3 !important; }
        .print-edit-on [data-print-editable] *:focus { outline: none; }
        [data-print-editable]:focus { outline: 2px solid #f59e0b; }
    </style>
</head>

        const parseTxTitle = (titleStr, fallbackAmount) => {
            try {
                const parsed = JSON.parse(titleStr);
                if (parsed.summary) return parsed;
                return { summary: titleStr, items: [{ name: titleStr, qty: 1, price: fallbackAmount || 0 }], promos: {}, isTaxApplied: false, taxAmount: 0, memo: '' };
            } catch (e) {
                return { summary: titleStr, items: [{ name: titleStr, qty: 1, price: fallbackAmount || 0 }], promos: {}, isTaxApplied: false, taxAmount: 0, memo: '' };

        // ===================== [추가] 부가세 / 금액 계산 헬퍼 =====================
        // 로컬(한국 시간) 기준 YYYY-MM
        const getLocalMonth = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };
        // 로컬(한국 시간) 기준 YYYY-MM-DD
        const getLocalDate = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        // [추가] 거래명세서 최신순 정렬 (수정해도 순서가 바뀌지 않도록 고정 기준 사용)
        // 1순위: 거래일자 최신순 → 2순위: 최초 등록시각(created_at) 최신순 → 3순위: id 큰 순
        // ※ 수정(update)은 created_at·id를 바꾸지 않으므로 수정한 명세서가 위로 올라오지 않음
        const compareTxLatest = (a, b) => {
            const d = String(b.date || '').localeCompare(String(a.date || ''));
            if (d !== 0) return d;
            const ca = a.created_at ? new Date(a.created_at).getTime() : 0;
            const cb = b.created_at ? new Date(b.created_at).getTime() : 0;
            if (ca !== cb) return cb - ca;
            const na = Number(a.id), nb = Number(b.id);
            if (!isNaN(na) && !isNaN(nb)) return nb - na;
            return String(b.id || '').localeCompare(String(a.id || ''));
        };
        const sortTxLatest = (list) => [...(list || [])].sort(compareTxLatest);

        // [추가] 대시보드 품목명 통합 (표기가 다른 같은 제품을 하나로 집계)
        const PRODUCT_NAME_LIPBALM = '[화장품] 셀슈틱스 리투디엔 더마플라스트 립밤';
        const PRODUCT_NAME_CREAM = '[화장품] 셀슈틱스 리투디엔 더마플라스트 크림';
        const normalizeProductName = (raw) => {
            let name = String(raw || '').trim();
            if (!name) return name;
            name = name.replace(/리투지엔/g, '리투디엔');
            const compact = name.replace(/\s+/g, '');
            if (compact.includes('리투디엔')) {
                if (compact.includes('립밤')) return PRODUCT_NAME_LIPBALM;          // 리투디엔 립밤 / 셀슈틱스 리투디엔(리투지엔) 더마플라스트 립밤
                if (compact.includes('크림')) return PRODUCT_NAME_CREAM;            // 리투디엔 재싱크림 / 리투디엔 크림 / 더마플라스트 크림
            }
            if (compact.includes('코어임팩트')) return '[뷰티기기] 코어 임팩트';
            if (compact.includes('메디노베') && compact.includes('패치')) return '[화장품] 메디노베 키토제닉스 스팟 릴리프 패치'; // 메디노베 여드름 패치 등
            if (compact.includes('하이퍼샷')) return '[뷰티기기] 하이퍼 샷';
            if (compact.includes('루트바이탈리티') && compact.includes('샴푸') && compact.toLowerCase().includes('300ml')) return '[화장품] 루트 바이탈리티 볼륨 샴푸 300ml'; // 용량이 다른 샴푸(100ml 등)는 따로 표시
            if (compact.includes('셀룰러워터앰플부스터') && compact.toLowerCase().includes('60ml')) return '[화장품] 셀룰러 워터 앰플 부스터 60ml'; // 용량이 다른 제품은 따로 표시                                                  // 하이퍼샷 / 하이퍼 샷
            return name;
        };

        const isVatItemName = (name) => ['부가세 (10%)', '부가세(10%)', '부가세'].includes((name || '').trim());

        // 부가세 포함 금액 → 공급가액 + 부가세 분리 (공급가액 = 합계 × 10/11 반올림, 부가세 = 합계 − 공급가액)
        const splitVatFromGross = (gross) => {
            const g = Math.round(Number(gross) || 0);
            const supply = Math.round(g * 10 / 11);
            return { supply, vat: g - supply, gross: g };
        };

        // [추가] 품목의 '부가세 포함 1개 단가' 구하기 (구버전: 줄 합계(gross)만 저장된 경우 수량으로 나눠 환산)
        const getGrossUnit = (it) => {
            if (it.grossUnit != null && it.grossUnit !== '') return Number(it.grossUnit) || 0;
            const qty = Number(it.qty) || 1;
            if (it.gross != null && it.gross !== '') return (Number(it.gross) || 0) / qty;
            return Math.round((Number(it.price) || 0) * 1.1);
        };

        // 작성 중인 품목들의 공급가액/세액/합계 계산
        // [수정] 부가세 포함 모드: 줄 합계 = 부가세 포함 1개 단가 × 수량 → 공급가액/부가세 분리
        const calcTxItemsTotals = (items, isTaxApplied, priceMode) => {
            if (priceMode === 'gross') {
                let supplyTotal = 0, vatTotal = 0;
                const lines = items.map(it => {
                    const qty = Number(it.qty) || 0;
                    const sp = splitVatFromGross(getGrossUnit(it) * qty);
                    supplyTotal += sp.supply; vatTotal += sp.vat;
                    return { ...sp, unitGross: getGrossUnit(it) };
                });
                return { lines, supplyTotal, vatTotal, total: supplyTotal + vatTotal };
            }
            const lines = items.map(it => {
                const supply = Math.round((Number(it.qty) || 0) * (Number(it.price) || 0));
                return { supply, vat: 0, gross: supply };
            });
            const supplyTotal = lines.reduce((sum, l) => sum + l.supply, 0);
            const vatTotal = isTaxApplied ? Math.floor(supplyTotal * 0.1) : 0;
            return { lines, supplyTotal, vatTotal, total: supplyTotal + vatTotal };
        };

        // 저장된 명세서 1건의 공급가액 / 세액 / 합계 (구버전 데이터 호환)
        const getTxBreakdown = (tx) => {
            const parsed = parseTxTitle(tx.title, tx.amount);
            const total = Number(tx.amount) || 0;
            const items = parsed.items || [];
            let vat = 0;
            let supply = 0;
            if (parsed.priceMode === 'gross') {
                items.forEach(it => {
                    const sp = splitVatFromGross(it.gross != null ? it.gross : (Number(it.qty) || 0) * (Number(it.price) || 0));
                    supply += sp.supply; vat += sp.vat;
                });
            } else {
                items.forEach(it => {
                    const line = Math.round((Number(it.qty) || 0) * (Number(it.price) || 0));
                    if (isVatItemName(it.name)) vat += line;
                    else supply += line;
                });
                if (parsed.isTaxApplied) vat = Number(parsed.taxAmount) || vat;
            }
            if (supply + vat !== total) supply = total - vat; // 합계 불일치 시 총액 기준으로 보정
            return { supply, vat, total, parsed };
        };

        // 저장된 명세서 1건을 품목별 (공급가액/세액/합계) 라인으로 변환
        const getTxItemLines = (tx) => {
            const { supply, vat, parsed } = getTxBreakdown(tx);
            const items = (parsed.items || []).filter(it => !isVatItemName(it.name));
            let lines = items.map(it => {
                const qty = Number(it.qty) || 0;
                if (parsed.priceMode === 'gross') {
                    const sp = splitVatFromGross(it.gross != null ? it.gross : qty * (Number(it.price) || 0));
                    return { name: it.name, qty, unitPrice: qty ? sp.supply / qty : sp.supply, supply: sp.supply, vat: sp.vat, gross: sp.gross };
                }
                const lineSupply = Math.round(qty * (Number(it.price) || 0));
                return { name: it.name, qty, unitPrice: Number(it.price) || 0, supply: lineSupply, vat: 0, gross: lineSupply };
            });
            if (lines.length === 0) {
                return [{ name: parsed.summary || '거래', qty: 1, unitPrice: supply, supply, vat, gross: supply + vat }];
            }
            // 공급가 합계 보정
            const lineSupplySum = lines.reduce((s, l) => s + l.supply, 0);
            if (lineSupplySum !== supply) {
                const last = lines[lines.length - 1];
                last.supply += (supply - lineSupplySum);
                last.gross = last.supply + last.vat;
            }
            // 공급가 입력 방식 + 부가세 적용: 세액을 품목별로 배분 (마지막 품목에서 단수 보정)
            if (parsed.priceMode !== 'gross' && vat > 0) {
                let remaining = vat;
                lines = lines.map((l, i) => {
                    const v = i === lines.length - 1 ? remaining : Math.floor(l.supply * 0.1);
                    remaining -= v;
                    return { ...l, vat: v, gross: l.supply + v };
                });
            }
            return lines;
        };

        // 선택 월의 매출 거래를 일자별로 집계. 기존 재무현황과 동일한 공급가액 기준.
        const buildDailyOrderCalendar = (transactions, month) => {
            if (!/^\d{4}-\d{2}$/.test(month || '')) return { days: [], cells: [], amount: 0, qty: 0, count: 0 };
            const [year, monthNumber] = month.split('-').map(Number);
            if (monthNumber < 1 || monthNumber > 12) return { days: [], cells: [], amount: 0, qty: 0, count: 0 };
            const days = Array.from({ length: new Date(year, monthNumber, 0).getDate() }, (_, i) => ({
                date: `${month}-${String(i + 1).padStart(2, '0')}`, day: i + 1,
                amount: 0, qty: 0, count: 0, products: new Map(), unknownCount: 0
            }));
            transactions.forEach(tx => {
                if (tx.txType && tx.txType !== 'sales') return;
                const date = String(tx.date || '').slice(0, 10);
                if (!date.startsWith(`${month}-`)) return;
                const day = days[Number(date.slice(8, 10)) - 1];
                if (!day || day.date !== date) return;
                const { supply, parsed } = getTxBreakdown(tx);
                day.amount += supply;
                day.count += 1;
                // 상세 품목이 없는 구형 명세서는 임의로 수량 1개를 만들지 않음.
                let savedItems = null;
                try { savedItems = JSON.parse(tx.title); } catch (_) {}
                if (!savedItems || !savedItems.summary || !Array.isArray(savedItems.items)) {
                    day.unknownCount += 1;
                    return;
                }
                (parsed.items || []).forEach(item => {
                    const name = normalizeProductName(item.name);
                    if (!name || isVatItemName(item.name)) return;
                    const qty = Number(item.qty) || 0;
                    day.qty += qty;
                    day.products.set(name, (day.products.get(name) || 0) + qty);
                });
            });
            days.forEach(day => { day.products = Array.from(day.products, ([name, qty]) => ({ name, qty })).sort((a, b) => b.qty - a.qty || a.name.localeCompare(b.name, 'ko')); });
            const leading = new Date(year, monthNumber - 1, 1).getDay();
            const cells = [...Array(leading).fill(null), ...days];
            while (cells.length % 7) cells.push(null);
            return { days, cells, amount: days.reduce((s, d) => s + d.amount, 0), qty: days.reduce((s, d) => s + d.qty, 0), count: days.reduce((s, d) => s + d.count, 0) };
        };

        const DailyOrderCalendar = ({ transactions, month, label, formatCurrency }) => {
            const data = useMemo(() => buildDailyOrderCalendar(transactions, month), [transactions, month]);

                            <h4 className="font-bold text-slate-800 flex items-center gap-2"><Icon name="Calendar" size={18} className="text-blue-600" />{label} 일자별 주문 현황</h4>
                            <p className="text-xs text-slate-500 mt-1">매출 거래명세서 거래일자 기준 · 주문액은 부가세 제외 · 품목별 수량 단위: 개</p>

                            <span className="text-slate-500">총수량 <b className="text-slate-800">{fmtQty(data.qty)}개</b></span>
                            <span className="text-slate-500">명세서 <b className="text-slate-800">{data.count.toLocaleString('ko-KR')}건</b></span>
                        </div>
                    </div>
                    {data.count === 0 && <p className="px-5 py-3 text-sm text-slate-500 border-b border-slate-200" role="status">선택한 월에 등록된 매출 주문이 없습니다.</p>}
                    <div className="overflow-x-auto" tabIndex="0" aria-label="일별 주문 달력. 좁은 화면에서는 좌우로 스크롤하세요.">

                                    <div key={day.date} data-order-date={day.date} className={`min-w-0 min-h-[150px] p-3 border-r border-b border-slate-100 ${day.date === today ? 'bg-blue-50/50' : 'bg-white'}`}>
                                        <div className="flex justify-between items-center mb-2">
                                            <time dateTime={day.date} className={`text-sm font-bold ${index % 7 === 0 ? 'text-red-500' : index % 7 === 6 ? 'text-blue-600' : 'text-slate-700'}`}>{day.day}</time>

                                            <ul className="space-y-1.5 border-t border-slate-100 pt-2">{day.products.slice(0, 3).map(productRow)}</ul>
                                            {day.products.length > 3 && <details className="mt-2"><summary className="text-xs text-blue-600 cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500">나머지 {day.products.length - 3}개 품목 보기</summary><ul className="space-y-1.5 mt-2">{day.products.slice(3).map(productRow)}</ul></details>}
                                            {day.unknownCount > 0 && <p className="text-[11px] text-amber-700 mt-2">상세 수량 미등록 {day.unknownCount}건</p>}

        // 금액 한글 표기 (예: 1,100,000 → 일백일십만)
        const numberToKorean = (num) => {
            let n = Math.floor(Math.abs(Number(num) || 0));
            if (!n) return '영';
            const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
            const units = ['', '십', '백', '천'];
            const big = ['', '만', '억', '조', '경'];
            let result = '';
            let bi = 0;
            while (n > 0) {
                const chunk = n % 10000;
                if (chunk) {
                    let str = '';
                    let c = chunk;
                    for (let i = 0; i < 4; i++) {
                        const d = c % 10;
                        if (d) str = digits[d] + units[i] + str;
                        c = Math.floor(c / 10);
                    }
                    result = str + big[bi] + result;
                }
                n = Math.floor(n / 10000);
                bi++;
            }
            return result;
        };

            const processBrandImage = (file, { maxW, maxH, removeWhite }) => new Promise((resolve, reject) => {
                if (!file) return reject(new Error('파일이 없습니다.'));
                if (!/^image\//.test(file.type)) return reject(new Error('이미지 파일(PNG, JPG 등)만 등록할 수 있습니다.'));
                if (file.size > 10 * 1024 * 1024) return reject(new Error('10MB 이하 이미지만 등록할 수 있습니다.'));
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('이미지를 열 수 없습니다.'));
                    img.onload = () => {
                        const scale = Math.min(1, maxW / img.width, maxH / img.height);
                        const w = Math.max(1, Math.round(img.width * scale));
                        const h = Math.max(1, Math.round(img.height * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, w, h);
                        if (removeWhite) {
                            const d = ctx.getImageData(0, 0, w, h);
                            const px = d.data;
                            for (let i = 0; i < px.length; i += 4) {
                                const r = px[i], g = px[i + 1], b = px[i + 2];
                                const minC = Math.min(r, g, b);
                                if (minC >= 235) px[i + 3] = 0;                                   // 흰색 → 투명
                                else if (minC >= 200) px[i + 3] = Math.round(px[i + 3] * (235 - minC) / 35); // 경계 부드럽게
                            }
                            ctx.putImageData(d, 0, 0);
                        }
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });

                            const qty = Number(it.qty) || 0;
                            if (it.supply != null && qty) return Number(it.supply) / qty;
                            return (p.price_mode === 'gross') ? Math.round((Number(it.unitPrice) || 0) * 10 / 11) : Number(it.unitPrice) || 0;
                        }
                    }
                    return null;
                };
                const sameVendor = search(purchaseOrders.filter(p => String(p.account_id) === String(accId)));

                const purchaseTxs = transactions.filter(t => t.txType === 'purchase' && (!accId || String(t.accountId) === String(accId)));

                return search(purchaseOrders);

            const extractSubRegion = (address, region) => {
                if (!address) return '기타 상세지역';
                const parts = address.split(' ').filter(p => p.trim() !== '');
                let subRegion = '';
                
                for (let i = parts.length - 1; i >= 0; i--) {
                    const part = parts[i];
                    if (part.match(/동\d*$/) || part.endsWith('읍') || part.endsWith('면')) {
                        subRegion = part;
                        if (i > 0 && (parts[i-1].endsWith('구') || parts[i-1].endsWith('군'))) {
                            subRegion = `${parts[i-1]} ${part}`;
                        }
                        break;
                    }
                }
                
                if (!subRegion) {
                    for (let i = 0; i < parts.length; i++) {
                        const part = parts[i];
                        if (part.includes('시') && part !== '서울특별시' && part !== '부산광역시' && part !== '대구광역시' && part !== '인천광역시' && part !== '광주광역시' && part !== '대전광역시' && part !== '울산광역시') {

                            } else {
                                subRegion = part; break;
                            }
                        } else if (part.endsWith('구') || part.endsWith('군')) {

                        }
                    }
                }

            // ===================== [추가] 거래명세서 조회 공통 필터 =====================
            const matchTxType = (tr, typeFilter) => {

            };
            const switchToAccountList = (accountId, month) => {
                setTxAccountFilter(accountId);

           // [수정된 부분] 대시보드 총 미수금/미지급금을 거래명세서 실시간 합산 기준으로 변경
            const totalReceivables = transactions
                .filter(t => (!t.txType || t.txType === 'sales') && t.status !== '수금완료')
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
                
            const totalPayables = transactions
                .filter(t => t.txType === 'purchase' && t.status !== '지급완료')
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            
            const dashboardSales = transactions.filter(t => t.date && t.date.startsWith(dashboardMonth) && (!t.txType || t.txType === 'sales')).reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            const collectedSales = transactions.filter(t => (!t.txType || t.txType === 'sales') && t.status === '수금완료').reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

            // ===================== [수정] 대시보드 월별 재무 지표 (모두 부가세 제외 = 공급가액 기준) =====================
            // 기준: 거래명세서의 거래일자(date). 부가세는 별도(매출세액/매입세액)로 집계
            const calcMonthFinance = (month) => {
                const r = { sales: 0, purchase: 0, receivable: 0, collected: 0, payable: 0, paid: 0, salesVat: 0, purchaseVat: 0, salesGross: 0, purchaseGross: 0, salesCount: 0, purchaseCount: 0 };
                transactions.forEach(t => {
                    if (month && !(t.date || '').startsWith(month)) return;
                    const isSales = !t.txType || t.txType === 'sales';
                    const { supply, vat, total } = getTxBreakdown(t);
                    if (isSales) {
                        r.sales += supply; r.salesVat += vat; r.salesGross += total; r.salesCount += 1;
                        if (t.status === '수금완료') r.collected += supply; else r.receivable += supply;
                    } else if (t.txType === 'purchase') {
                        r.purchase += supply; r.purchaseVat += vat; r.purchaseGross += total; r.purchaseCount += 1;
                        if (t.status === '지급완료') r.paid += supply; else r.payable += supply;
                    }
                });
                r.profit = r.sales - r.purchase;
                r.vatNet = r.salesVat - r.purchaseVat; // + 납부세액 / − 환급세액
                return r;
            };
            const sumFinance = (rows) => rows.reduce((a, r) => {
                Object.keys(a).forEach(k => a[k] += (r[k] || 0));
                return a;
            }, { sales: 0, purchase: 0, profit: 0, receivable: 0, collected: 0, payable: 0, paid: 0, salesVat: 0, purchaseVat: 0, vatNet: 0, salesGross: 0, purchaseGross: 0, salesCount: 0, purchaseCount: 0 });
            const shiftMonth = (month, diff) => {
                const [y, m] = month.split('-').map(Number);
                const d = new Date(y, m - 1 + diff, 1);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            };
            const dashFin = calcMonthFinance(dashboardMonth);
            const allFin = calcMonthFinance(null);
            const dashYear = dashboardMonth.slice(0, 4);
            const dashMonthLabel = `${dashboardMonth.slice(0, 4)}년 ${Number(dashboardMonth.slice(5, 7))}월`;
            const yearMonths = Array.from({ length: 12 }, (_, i) => `${dashYear}-${String(i + 1).padStart(2, '0')}`);
            const yearFinRows = yearMonths.map(m => ({ month: m, ...calcMonthFinance(m) }));
            const yearFinSum = sumFinance(yearFinRows);

            // [추가] 부가세 현황: 법인사업자 기준 분기(예정/확정) 신고
            const dashQuarter = Math.floor((Number(dashboardMonth.slice(5, 7)) - 1) / 3) + 1; // 1~4
            const VAT_QUARTERS = [
                { q: 1, label: '1기 예정', months: [1, 2, 3], due: (y) => `${y}.04.25` },
                { q: 2, label: '1기 확정', months: [4, 5, 6], due: (y) => `${y}.07.25` },
                { q: 3, label: '2기 예정', months: [7, 8, 9], due: (y) => `${y}.10.25` },
                { q: 4, label: '2기 확정', months: [10, 11, 12], due: (y) => `${Number(y) + 1}.01.25` },
            ];
            const vatQuarterRows = VAT_QUARTERS.map(Q => ({ ...Q, ...sumFinance(yearFinRows.filter(r => Q.months.includes(Number(r.month.slice(5))))) }));
            const curVatQ = vatQuarterRows[dashQuarter - 1];
            const curHalf = sumFinance(yearFinRows.filter(r => (dashQuarter <= 2 ? Number(r.month.slice(5)) <= 6 : Number(r.month.slice(5)) >= 7)));
            const vatLabel = (n) => n >= 0 ? '납부세액' : '환급세액';

            const vendorAccs = accounts.filter(a => a.stage === '매입처' || a.vendorType);
            const domAccs = accounts.filter(a => !ACCOUNT_CATEGORIES.GROUP_PURCHASE.includes(a.type) && (!ACCOUNT_CATEGORIES.HOME_SHOPPING || !ACCOUNT_CATEGORIES.HOME_SHOPPING.includes(a.type)) && (!ACCOUNT_CATEGORIES.RETAIL || !ACCOUNT_CATEGORIES.RETAIL.includes(a.type)) && !ACCOUNT_CATEGORIES.OVERSEAS.includes(a.type) && a.stage !== '매입처' && !a.vendorType);

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                    const sup = p.supplier || {};
                    const ord = { ...HYM_ORDERER, ...(p.orderer || {}) };
                    const dlv = p.delivery || {};
                    const totalQty = items.reduce((s, it) => s + (Number(it.qty) || 0), 0);
                    const fmt = (n) => (Math.round(Number(n) || 0)).toLocaleString('ko-KR');

                    <div className={`print-root po-print-root fixed inset-0 bg-slate-100 z-[55] overflow-y-auto p-8 print:p-0 print:bg-white ${printEditMode ? 'print-edit-on' : ''}`}>

                                <label className={`flex items-center gap-1.5 text-sm px-2 ${poBranding.stamp ? 'text-slate-700 cursor-pointer' : 'text-slate-300'}`} title={poBranding.stamp ? '' : '로고·직인 설정에서 직인을 먼저 등록하세요'}><input type="checkbox" disabled={!poBranding.stamp} checked={!!poBranding.stamp && poShowStamp} onChange={(e) => setPoShowStamp(e.target.checked)} className="rounded w-4 h-4" /> 직인</label>

                                <button type="button" onClick={resetPrintEdits} className="px-3 py-2 border border-slate-300 rounded-md text-slate-600 hover:bg-slate-50 text-sm">원래대로</button>
                                {isAdmin && !p._preview && <button type="button" onClick={() => { const row = p; setPrintPO(null); openEditPoModal(row); }} className="px-3 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 text-sm">발주서 수정(저장)</button>}
                                <button onClick={() => setPrintPO(null)} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 text-sm">{p._preview ? '작성 화면으로' : '닫기'}</button>
                                <button onClick={handlePrint} className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium text-sm"><Icon name="Printer" size={16} /> 인쇄 / PDF 저장</button>
                            </div>
                        </div>
                        {printEditMode && (
                            <div className="print-edit-banner print:hidden mb-4 bg-amber-50 border border-amber-300 text-amber-800 text-sm rounded-lg px-4 py-3 leading-relaxed">
                                <b>수정 모드</b> · 점선 안의 글자를 클릭해 바로 고칠 수 있습니다. 수정 내용은 <b>이번 인쇄에만 적용</b>되며 저장되지 않습니다. 금액을 바꿔 저장하려면 [발주서 수정(저장)]을 이용하세요.
                            </div>
                        )}
                        <FrozenSheet key={`po-${p.id}-${p.updated_at || ''}-${printEditVersion}-${BR.updatedAt}-${logoOn}-${stampOn}`}>
                        <div data-print-editable="true" suppressContentEditableWarning className="print-sheet po-sheet bg-white border border-slate-300 shadow-sm p-10 text-slate-900 text-[12px] leading-snug">
                            {logoOn && BR.logoPos === 'top' && (
                                <div className="flex justify-center mb-2"><img src={BR.logo} alt="로고" className="object-contain" style={{ height: BR.logoHeight, maxWidth: '60%' }} /></div>
                            )}
                            <div className="flex items-end justify-between border-b-[3px] border-slate-900 pb-2 mb-4">
                                <div className="w-1/3">
                                    {logoOn && BR.logoPos === 'left' && <img src={BR.logo} alt="로고" className="object-contain mb-1 block" style={{ height: BR.logoHeight, maxWidth: '100%' }} />}
                                    <div className="text-xs text-slate-600">No. {p.po_no}</div>
                                </div>
                                <h2 className="text-3xl font-extrabold tracking-[0.6em] pl-[0.6em] whitespace-nowrap">발주서</h2>
                                <div className="w-1/3 text-right text-sm"><span className="font-semibold">발주일자 :</span> {p.order_date}</div>
                            </div>

                            <table className="w-full border-collapse mb-3">
                                <tbody>
                                    <tr>
                                        <th rowSpan="4" className={`${th} w-8`} style={{ writingMode: 'vertical-rl', letterSpacing: '0.4em' }}>공급자</th>
                                        <th className={`${th} w-20`}>상호</th><td className={`${td} font-bold`}>{sup.name || ''}</td>
                                        <th rowSpan="4" className={`${th} w-8`} style={{ writingMode: 'vertical-rl', letterSpacing: '0.4em' }}>발주자</th>
                                        <th className={`${th} w-20`}>상호</th><td className={`${td} font-bold`}><span className="relative inline-block pr-8">{ord.name}{stampOn && BR.stampInTable && <span className="absolute right-0 top-1/2 w-8 h-0">{stampImg(Math.round(BR.stampSize * 0.7))}</span>}</span></td>
                                    </tr>
                                    <tr>
                                        <th className={th}>사업자번호</th><td className={td}>{sup.bizNo || ''}{sup.ceo ? <span className="text-slate-500"> (대표 {sup.ceo})</span> : ''}</td>
                                        <th className={th}>사업자번호</th><td className={td}>{ord.bizNo}{ord.phone ? <span className="text-slate-500"> / Tel {ord.phone}</span> : ''}</td>
                                    </tr>
                                    <tr>
                                        <th className={th}>담당자</th><td className={td}>{sup.contact || ''}{sup.phone ? ` (${sup.phone})` : ''}</td>
                                        <th className={th}>주소</th><td className={`${td} text-[11px]`}>{ord.address}</td>
                                    </tr>
                                    <tr>
                                        <th className={th}>이메일</th><td className={td}>{sup.email || ''}</td>
                                        <th className={th}>담당자</th><td className={td}>{ord.contact || ''}{ord.contactPhone ? ` (${ord.contactPhone})` : ''}</td>
                                    </tr>
                                </tbody>
                            </table>

                            <p className="text-center font-medium my-3">아래 기재된 제품에 대하여 발주 의뢰드리오니, 지정된 일정에 따라 납품하여 주시기 바랍니다.</p>

                            <table className="w-full border-collapse mb-3">
                                <tbody>
                                    <tr><th className={`${th} w-28`}>입고처</th><td colSpan="3" className={`${td} font-bold`} style={{ backgroundColor: '#fef9c3' }}>{dlv.address || ''}</td></tr>
                                    <tr>
                                        <th className={th}>입고가능 시간</th><td className={td}>{dlv.hours || ''}</td>
                                        <th className={`${th} w-28`}>입고담당자</th><td className={td}>{dlv.manager || ''}{dlv.managerPhone ? ` (${dlv.managerPhone})` : ''}</td>
                                    </tr>
                                    <tr><th className={th}>비고</th><td colSpan="3" className={`${td} whitespace-pre-wrap text-[11px]`}>{dlv.note || ''}</td></tr>
                                </tbody>
                            </table>

                            <table className="w-full border-collapse mb-3">
                                <tbody>
                                    <tr>
                                        <th className={th}>공급가</th><td className={`${td} text-right`}>{fmt(p.supply_amount)}원</td>
                                        <th className={th}>부가세</th><td className={`${td} text-right`}>{fmt(p.vat_amount)}원</td>
                                        <th className={th}>합계금액</th><td className={`${td} text-right font-extrabold text-[14px]`} style={{ backgroundColor: '#fef9c3' }}>{fmt(p.total_amount)}원</td>
                                    </tr>
                                    <tr><td colSpan="6" className={`${td} text-center text-[11px] text-slate-600`}>일금 {numberToKorean(p.total_amount)}원정 (부가세 {Number(p.vat_amount) > 0 ? '포함' : '없음'})</td></tr>
                                </tbody>
                            </table>

                            <table className="w-full border-collapse mb-3">
                                <thead>
                                    <tr>
                                        <th className={`${th} w-8`}>No</th>
                                        <th className={th}>품목명</th>
                                        <th className={`${th} w-20`}>규격</th>
                                        <th className={`${th} w-14`}>발주량</th>
                                        <th className={`${th} w-20`}>단가</th>
                                        <th className={`${th} w-24`}>금액</th>
                                        <th className={`${th} w-20`}>세액</th>
                                        <th className={`${th} w-24`}>입고요청일</th>
                                        <th className={`${th} w-20`}>비고</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {items.map((it, i) => (
                                        <tr key={i}>
                                            <td className={`${td} text-center`}>{i + 1}</td>
                                            <td className={td}>{it.name}</td>
                                            <td className={`${td} text-center text-[11px]`}>{it.spec}</td>
                                            <td className={`${td} text-right`}>{fmt(it.qty)}</td>
                                            <td className={`${td} text-right`}>{fmt(unitSupplyOf(it))}</td>
                                            <td className={`${td} text-right`}>{fmt(it.supply)}</td>
                                            <td className={`${td} text-right`}>{fmt(it.vat)}</td>
                                            <td className={`${td} text-center`}>{it.dueDate || p.due_date || ''}</td>
                                            <td className={`${td} text-[11px]`}>{it.note}</td>
                                        </tr>
                                    ))}
                                    {Array.from({ length: fillerRows }).map((_, i) => (
                                        <tr key={`f${i}`}>{Array.from({ length: 9 }).map((__, j) => <td key={j} className={td}>&nbsp;</td>)}</tr>
                                    ))}
                                </tbody>
                                <tfoot>
                                    <tr className="font-bold bg-slate-100">
                                        <td colSpan="3" className={`${td} text-center tracking-widest`}>TOTAL</td>
                                        <td className={`${td} text-right`}>{fmt(totalQty)}</td>
                                        <td className={td}></td>
                                        <td className={`${td} text-right`}>{fmt(p.supply_amount)}</td>
                                        <td className={`${td} text-right`}>{fmt(p.vat_amount)}</td>
                                        <td colSpan="2" className={td}></td>
                                    </tr>
                                </tfoot>
                            </table>

                            <table className="w-full border-collapse">
                                <tbody>
                                    <tr><th className={`${th} text-left`}>발주 요청사항</th></tr>
                                    <tr><td className={`${td} whitespace-pre-wrap align-top`} style={{ height: '70px' }}>{p.request_note || ''}</td></tr>
                                </tbody>
                            </table>

                            <div className="sheet-footer flex justify-end items-center gap-3 mt-6 text-sm">
                                <span>{(p.order_date || '').replace(/-/g, '. ')}.</span>
                                <span className="font-bold">발주자 : {ord.name}</span>
                                <span className="relative inline-flex items-center justify-center w-12 h-12 border border-slate-400 rounded-full text-slate-400 text-xs">(인){stampOn && stampImg(BR.stampSize)}</span>
                            </div>
                        </div>
                        </FrozenSheet>
                    </div>
                    </div>
                    );
                })()}

                {isCalDetailModalOpen && (
                    <Modal title={`${selectedCalDate} 일정`} onClose={() => setIsCalDetailModalOpen(false)}>
                        <div className="space-y-4 min-h-[200px]">
                            {selectedDayEvents.length === 0 ? (
                                <div className="text-center text-slate-500 py-12">이 날짜에 등록된 일정이 없습니다.</div>
                            ) : (
                                <div className="space-y-3">
                                    {selectedDayEvents.map(event => (
                                        <div key={event.id} className="p-4 border border-slate-200 rounded-lg shadow-sm hover:shadow-md transition-shadow relative group">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex items-center gap-2">
                                                    <span className="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-1 rounded">{event.type}</span>
                                                    <h4 className="font-bold text-slate-800">{event.title}</h4>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => openEditEventModal(event)} className="text-slate-400 hover:text-blue-600 transition-colors" title="수정"><Icon name="Edit" size={16}/></button>
                                                    <button onClick={() => deleteCalendarEvent(event.id)} className="text-slate-400 hover:text-red-600 transition-colors" title="삭제"><Icon name="Trash2" size={16}/></button>
                                                </div>
                                            </div>
                                            <p className="text-sm text-slate-600 whitespace-pre-wrap">{event.note || '메모 없음'}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <div className="border-t border-slate-200 pt-4 text-right">
                                <button onClick={openAddEventModal} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium inline-flex items-center gap-2"><Icon name="Plus" size={16}/> 새 일정 추가</button>
                            </div>
                        </div>
                    </Modal>
                )}

                {isEventModalOpen && (
                    <Modal title={editingEventId ? "일정 수정" : "새 일정 추가"} onClose={() => setIsEventModalOpen(false)}>
                        <form onSubmit={saveCalendarEvent} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">날짜</label>
                                <input type="text" value={selectedCalDate} readOnly className="w-full px-3 py-2 border border-slate-300 rounded-md bg-slate-50 text-slate-500" />
                            </div>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="col-span-1">
                                    <label className="block text-sm font-medium text-slate-700 mb-1">일정 구분</label>
                                    <select value={calEventType} onChange={(e) => setCalEventType(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500">
                                        <option value="미팅">미팅</option><option value="통화">통화</option><option value="기타 업무">기타 업무</option><option value="개인 일정">개인 일정</option>
                                    </select>
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-medium text-slate-700 mb-1">일정 제목 (대상자 등)</label>
                                    <input type="text" required value={calEventTitle} onChange={(e) => setCalEventTitle(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500" placeholder="예: 김원장님 2차 미팅" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">상세 메모</label>
                                <textarea value={calEventNote} onChange={(e) => setCalEventNote(e.target.value)} rows="4" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500" placeholder="상세 내용을 입력하세요 (선택사항)"></textarea>
                            </div>
                            <div className="flex justify-end gap-2 pt-4 border-t border-slate-200 mt-4">
                                <button type="button" onClick={() => setIsEventModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 font-medium">취소</button>
                                <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">저장</button>
                            </div>
                        </form>
                    </Modal>
                )}

                {alertMsg && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
                        <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm text-center">
                            <Icon name="AlertCircle" size={48} className="mx-auto text-amber-500 mb-4" />
                            <p className="text-slate-800 font-medium mb-6 whitespace-pre-wrap">{alertMsg}</p>
                            <button onClick={() => setAlertMsg('')} className="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors">확인</button>
                        </div>
                    </div>
                )}
                {confirmDialog && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
                        <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-md text-center">
                            <Icon name="AlertCircle" size={48} className="mx-auto text-amber-500 mb-4" />
                            <p className="text-slate-800 font-medium mb-6 whitespace-pre-wrap">{confirmDialog.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg font-medium hover:bg-slate-200 transition-colors">취소</button>
                                <button onClick={confirmDialog.onConfirm} className="flex-1 bg-red-600 text-white py-2 rounded-lg font-medium hover:bg-red-700 transition-colors">확인 및 실행</button>
                            </div>
                        </div>
                    </div>
                )}
                </div>
            );
        }

        function Modal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center p-5 border-b border-slate-200 bg-slate-50 shrink-0">
                    <h2 className="text-lg font-bold text-slate-800">{title}</h2>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 hover:bg-slate-200 rounded transition-colors"><Icon name="X" size={20} /></button>
                    </div>
                    <div className="p-6 overflow-y-auto">{children}</div>
                </div>
                </div>
            );
        }

        function SidebarItem({ icon, label, isActive, onClick, isOpen = true }) {
            return (
                <button
                    onClick={onClick}
                    title={!isOpen ? label : undefined}
                    className={`w-full flex items-center gap-3 py-3 rounded-lg transition-all duration-200 ${isOpen ? 'px-4' : 'px-0 justify-center'} ${isActive ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                >
                    <div className="shrink-0">{icon}</div>
                    {isOpen && <span className="font-medium text-sm whitespace-nowrap">{label}</span>}
                </button>
            );
        }

        function KpiCard({ title, amount, icon, color, sub }) {
            return (
                <div className={`bg-white p-6 rounded-xl shadow-sm border-l-4 ${color} border-y border-r border-slate-200 flex items-center justify-between hover:shadow-md transition-shadow`}>
                    <div className="min-w-0">
                        <h4 className="text-sm font-medium text-slate-500 mb-1">{title}</h4>
                        <div className="text-2xl font-bold text-slate-800">{amount}</div>
                        {sub && <div className="text-xs text-slate-400 mt-1">{sub}</div>}
                    </div>
                    <div className="p-3 bg-slate-50 rounded-full shrink-0">{icon}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

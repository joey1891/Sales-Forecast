<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)힘 CRM 시스템</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Lucide Icons (React버전) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* 탭(토글) 등 부드러운 애니메이션을 위한 유틸 */
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // React에서 lucide-react 라이브러리를 쓰지 못하는 CDN 환경이므로
        // DOM 에러를 발생시키는 createIcons() 대신 SVG 문자열을 렌더링하는 안전한 방식 적용
        const Icon = ({ name, size = 24, className = "" }) => {
            const svgRef = React.useRef(null);
            
            React.useEffect(() => {
                if (svgRef.current && lucide.icons[name]) {
                    // lucide 객체에서 해당 아이콘의 SVG 요소들을 가져와 주입
                    const iconNode = lucide.icons[name];
                    const svgString = `<svg class="lucide lucide-${name} ${className}" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconNode.map(node => `<${node[0]} ${Object.entries(node[1]).map(([k, v]) => `${k}="${v}"`).join(' ')}></${node[0]}>`).join('')}</svg>`;
                    svgRef.current.innerHTML = svgString;
                }
            }, [name, size, className]);

            return <span ref={svgRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const IconBuilding2 = (props) => <Icon name="Building2" {...props} />;
        const IconLayoutDashboard = (props) => <Icon name="LayoutDashboard" {...props} />;
        const IconUsers = (props) => <Icon name="Users" {...props} />;
        const IconFileSpreadsheet = (props) => <Icon name="FileSpreadsheet" {...props} />;
        const IconCreditCard = (props) => <Icon name="CreditCard" {...props} />;
        const IconLogOut = (props) => <Icon name="LogOut" {...props} />;
        const IconLock = (props) => <Icon name="Lock" {...props} />;
        const IconSearch = (props) => <Icon name="Search" {...props} />;
        const IconAlertCircle = (props) => <Icon name="AlertCircle" {...props} />;
        const IconFileText = (props) => <Icon name="FileText" {...props} />;
        const IconCheckCircle2 = (props) => <Icon name="CheckCircle2" {...props} />;
        const IconPlus = (props) => <Icon name="Plus" {...props} />;
        const IconUserCircle = (props) => <Icon name="UserCircle" {...props} />;
        const IconPhone = (props) => <Icon name="Phone" {...props} />;
        const IconMail = (props) => <Icon name="Mail" {...props} />;
        const IconMapPin = (props) => <Icon name="MapPin" {...props} />;
        const IconCalendar = (props) => <Icon name="Calendar" {...props} />;
        const IconPrinter = (props) => <Icon name="Printer" {...props} />;
        const IconX = (props) => <Icon name="X" {...props} />;
        const IconChevronDown = (props) => <Icon name="ChevronDown" {...props} />;
        const IconChevronRight = (props) => <Icon name="ChevronRight" {...props} />;

        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = 'https://mfnzqerkzsvdsaszuwil.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mbnpxZXJrenN2ZHNhc3p1d2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTc0NjgsImV4cCI6MjA5NjU5MzQ2OH0.i9tSTw8r8plr7JTcTFg54bzIGw8XipNSsddx14MhznY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ACCOUNT_CATEGORIES = {
            HOSPITAL: ['병의원', '체인병의원', '병의원 도매', '병의원 온라인 도매'],
            PHARMACY: ['일반약국', '체인약국', '창고형 약국', '약국 도매', '약국 온라인 도매']
        };

        const REGIONS = [
            '서울', '경기', '인천', '부산', '대구', '광주', '대전', '울산', '세종', 
            '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주'
        ];

        function App() {
            const [user, setUser] = useState(null); 
            const [appUser, setAppUser] = useState(null); 
            const [authChecking, setAuthChecking] = useState(true);
            
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [rememberId, setRememberId] = useState(false);
            const [authError, setAuthError] = useState('');

            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [accounts, setAccounts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [visits, setVisits] = useState([]);

            const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [printTransaction, setPrintTransaction] = useState(null);
            const [selectedAccount, setSelectedAccount] = useState(null);
            
            const [selectedSource, setSelectedSource] = useState('온라인 검색');
            const [transactionFilter, setTransactionFilter] = useState('all');
            const [receivableFilter, setReceivableFilter] = useState('all');
            const [dbError, setDbError] = useState(''); 

            const [expandedStages, setExpandedStages] = useState([]); 
            const [isEditingAccount, setIsEditingAccount] = useState(false);

            useEffect(() => {
                const checkSession = async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        setUser(session.user);
                        fetchAppUser(session.user.email);
                    } else {
                        const savedEmail = localStorage.getItem('hym_remembered_email');
                        if(savedEmail) {
                            setLoginEmail(savedEmail);
                            setRememberId(true);
                        }
                        setAuthChecking(false);
                    }
                };
                checkSession();

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) {
                        setUser(session.user);
                        fetchAppUser(session.user.email);
                    } else {
                        setUser(null);
                        setAppUser(null);
                    }
                });
                return () => subscription.unsubscribe();
            }, []);

            const fetchAppUser = async (email) => {
                try {
                    const { data, error } = await supabase.from('hym_users').select('*').eq('email', email).single();
                    if (data) setAppUser(data);
                    else setAppUser({ email: email, name: email.split('@')[0] });
                } catch (e) {
                    console.error(e);
                } finally {
                    setAuthChecking(false);
                }
            };

            const loadData = async () => {
                if (!user) return;
                try {
                    const [accRes, txRes, visRes] = await Promise.all([
                        supabase.from('accounts').select('*').order('created_at', { ascending: false }),
                        supabase.from('transactions').select('*').order('date', { ascending: false }),
                        supabase.from('visits').select('*').order('date', { ascending: false })
                    ]);
                    
                    if(accRes.data) setAccounts(accRes.data);
                    if(txRes.data) setTransactions(txRes.data);
                    if(visRes.data) setVisits(visRes.data);
                } catch (err) {
                    console.error("데이터 로딩 오류:", err);
                }
            };

            useEffect(() => { loadData(); }, [user]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: loginEmail,
                        password: loginPassword,
                    });
                    if (error) throw error;
                    
                    if (rememberId) localStorage.setItem('hym_remembered_email', loginEmail);
                    else localStorage.removeItem('hym_remembered_email');
                } catch (err) {
                    setAuthError('로그인 실패: 이메일 또는 비밀번호를 확인해주세요.');
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                if (!rememberId) setLoginEmail('');
                setLoginPassword('');
            };

            const isAdmin = appUser?.email === 'wjshin2450@gmail.com';
            const totalReceivables = accounts.reduce((sum, acc) => sum + (Number(acc.receivable) || 0), 0);
            const thisMonth = new Date().toISOString().substring(0, 7); 
            const thisMonthSales = transactions
                .filter(t => t.date && t.date.startsWith(thisMonth))
                .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
            const collectedSales = transactions
                .filter(t => t.status === '수금완료')
                .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);

            const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(amount);

            const getFilteredAccounts = (list, filterType) => {
                if (filterType === 'all') return list;
                return list.filter(acc => {
                    const isHospital = ACCOUNT_CATEGORIES.HOSPITAL.includes(acc.type);
                    const isPharmacy = ACCOUNT_CATEGORIES.PHARMACY.includes(acc.type);
                    if (filterType === 'hospital') return isHospital;
                    if (filterType === 'pharmacy') return isPharmacy;
                    return true;
                });
            };

            const extractRegion = (address) => {
                if (!address) return '미입력/기타';
                for (const region of REGIONS) {
                    if (address.includes(region)) return region;
                }
                return '미입력/기타';
            };

            const toggleStage = (stage) => {
                setExpandedStages(prev => prev.includes(stage) ? prev.filter(s => s !== stage) : [...prev, stage]);
            };

            const handleAddAccount = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                setDbError(''); 
                
                const formData = new FormData(e.target);
                const newAccount = {
                    name: formData.get('name'),
                    type: formData.get('type'),
                    contact: formData.get('contact'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    address: formData.get('address'),
                    collectionDay: formData.get('collectionDay'),
                    paymentMethod: formData.get('paymentMethod'),
                    salesRepName: formData.get('salesRepName'),
                    salesRepPhone: formData.get('salesRepPhone'),
                    stage: formData.get('stage'),
                    source: formData.get('source'),
                    sourceDetail: formData.get('sourceDetail') || '',
                    meetDate: formData.get('meetDate') || '',
                    firstTradeDate: formData.get('firstTradeDate') || '',
                    lastTradeDate: formData.get('firstTradeDate') || '',
                    collectionPlanDate: '', 
                    receivable: 0
                };
                
                try {
                    const { error } = await supabase.from('accounts').insert([newAccount]);
                    if (error) throw error; 
                    
                    localStorage.removeItem('hym_account_draft');
                    setIsAccountModalOpen(false);
                    loadData();
                } catch (err) {
                    setDbError('데이터베이스 저장 실패: ' + (err.message || '알 수 없는 오류'));
                }
            };

            const handleUpdateAccount = async (e) => {
                e.preventDefault();
                if (!isAdmin || !selectedAccount) return;
                setDbError('');
                
                const formData = new FormData(e.target);
                const updatedData = {
                    name: formData.get('name'),
                    type: formData.get('type'),
                    contact: formData.get('contact'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    address: formData.get('address'),
                    collectionDay: formData.get('collectionDay'),
                    paymentMethod: formData.get('paymentMethod'),
                    salesRepName: formData.get('salesRepName'),
                    salesRepPhone: formData.get('salesRepPhone'),
                    stage: formData.get('stage'),
                    source: formData.get('source'),
                    sourceDetail: formData.get('sourceDetail') || '',
                    meetDate: formData.get('meetDate') || '',
                    firstTradeDate: formData.get('firstTradeDate') || '',
                };
                
                try {
                    const { error } = await supabase.from('accounts').update(updatedData).eq('id', selectedAccount.id);
                    if (error) throw error;
                    
                    setIsEditingAccount(false);
                    setSelectedAccount({...selectedAccount, ...updatedData});
                    loadData();
                } catch (err) {
                    setDbError('수정 실패: ' + (err.message || '알 수 없는 오류'));
                }
            };

            const handleDraftInput = (e) => {
                if(!e.currentTarget) return;
                const formData = new FormData(e.currentTarget);
                const draft = Object.fromEntries(formData.entries());
                localStorage.setItem('hym_account_draft', JSON.stringify(draft));
            };

            const getAccountDraft = () => {
                try { return JSON.parse(localStorage.getItem('hym_account_draft')) || {}; } 
                catch { return {}; }
            };

            const handleAddTransaction = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;

                const formData = new FormData(e.target);
                const amount = Number(formData.get('amount'));
                const accountId = formData.get('accountId');
                const transactionDate = formData.get('date');
                const paymentMethod = formData.get('paymentMethod');
                
                const newTransaction = {
                    accountId: accountId,
                    date: transactionDate,
                    title: formData.get('title'),
                    amount: amount,
                    status: '청구됨',
                    paymentMethod: paymentMethod
                };
                
                try {
                    const { error: txError } = await supabase.from('transactions').insert([newTransaction]);
                    if (txError) throw txError;
                    
                    const targetAccount = accounts.find(a => a.id === accountId);
                    if (targetAccount) {
                        const { error: accError } = await supabase.from('accounts').update({
                            receivable: (Number(targetAccount.receivable) || 0) + amount,
                            lastTradeDate: transactionDate,
                            stage: '거래개시' 
                        }).eq('id', accountId);
                        if (accError) throw accError;
                    }
                    setIsTransactionModalOpen(false);
                    loadData();
                } catch (err) {
                    alert('명세서 발행에 실패했습니다.');
                }
            };

            const handleAddVisit = async (e) => {
                e.preventDefault();
                if (!selectedAccount || !isAdmin) return;

                const formData = new FormData(e.target);
                const newVisit = {
                    accountId: selectedAccount.id,
                    date: formData.get('date'),
                    note: formData.get('note'),
                    author: appUser?.name || '관리자'
                };
                
                try {
                    const { error } = await supabase.from('visits').insert([newVisit]);
                    if(error) throw error;
                    e.target.reset(); 
                    loadData();
                } catch (err) {
                    console.error(err);
                }
            };

            const handleUpdateCollectionDate = async (accountId, newDate) => {
                if (!isAdmin) return;
                try {
                    const { error } = await supabase.from('accounts').update({ collectionPlanDate: newDate }).eq('id', accountId);
                    if(error) throw error;
                    loadData();
                } catch (err) {
                    console.error(err);
                }
            };

            const handleCompleteCollection = async (accountId) => {
                if (!isAdmin) return;
                if(!confirm('채권 잔액을 0원으로 만들고 모든 명세서를 수금완료로 변경하시겠습니까?')) return;
                
                try {
                    await supabase.from('accounts').update({ receivable: 0 }).eq('id', accountId);
                    await supabase.from('transactions').update({ status: '수금완료' }).eq('accountId', accountId);
                    loadData();
                } catch (err) {
                    console.error(err);
                }
            };

            if (authChecking) {
                return <div className="h-screen w-screen flex items-center justify-center bg-slate-50"><div className="animate-pulse text-blue-600 font-bold">인증 정보 불러오는 중...</div></div>;
            }

            if (!user) {
                return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                    <div className="bg-slate-900 p-8 text-center">
                        <div className="inline-block bg-blue-600 p-3 rounded-xl mb-4 shadow-lg">
                            <IconBuilding2 className="text-white" />
                        </div>
                        <h1 className="text-2xl font-bold text-white tracking-tight">(주)힘 CRM 시스템</h1>
                        <p className="text-slate-400 text-sm mt-2">임직원 전용 영업/채권 관리 (Supabase)</p>
                    </div>
                    
                    <div className="p-8">
                        <div className="flex gap-4 mb-6 border-b border-slate-200">
                            <button className="pb-2 font-medium text-sm transition-colors border-b-2 border-blue-600 text-blue-600">사내 로그인</button>
                            <span className="pb-2 font-medium text-sm text-slate-400 cursor-not-allowed" title="관리자에게 계정 생성을 요청하세요">계정 등록 (제한됨)</span>
                        </div>
                        {authError && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm flex gap-2 items-center"><IconAlertCircle size={16} /> {authError}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">이메일 계정</label>
                                <input type="email" required value={loginEmail} onChange={e => setLoginEmail(e.target.value)} className="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="이메일을 입력하세요" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">비밀번호</label>
                                <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} className="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="••••••••" />
                            </div>
                            <div className="flex items-center justify-between pt-1">
                                <label className="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                                    <input type="checkbox" checked={rememberId} onChange={e => setRememberId(e.target.checked)} className="rounded text-blue-600 focus:ring-blue-500" />
                                    아이디 저장
                                </label>
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition-colors mt-2 shadow-md">로그인</button>
                        </form>
                    </div>
                    </div>
                </div>
                );
            }

            return (
                <div className="flex h-screen bg-slate-50 font-sans text-slate-800">
                <aside className="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10 shrink-0 print:hidden">
                    <div className="p-6 flex items-center gap-3 border-b border-slate-800">
                        <div className="bg-blue-600 p-2 rounded-lg"><IconBuilding2 className="text-white" /></div>
                        <h1 className="text-xl font-bold tracking-tight">(주)힘 CRM</h1>
                    </div>
                    <nav className="flex-1 py-6 px-4 space-y-2">
                        <SidebarItem icon={<IconLayoutDashboard size={20} />} label="대시보드" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                        <SidebarItem icon={<IconUsers size={20} />} label="거래처" isActive={activeTab === 'accounts'} onClick={() => setActiveTab('accounts')} />
                        <SidebarItem icon={<IconFileSpreadsheet size={20} />} label="거래명세서 관리" isActive={activeTab === 'transactions'} onClick={() => setActiveTab('transactions')} />
                        <SidebarItem icon={<IconCreditCard size={20} />} label="채권(수금) 현황" isActive={activeTab === 'receivables'} onClick={() => setActiveTab('receivables')} />
                    </nav>
                    <div className="p-4 border-t border-slate-800">
                        <div className="flex items-center justify-between">
                            <div className="text-xs text-slate-300">
                                <p className="font-semibold text-white">{appUser?.name}</p>
                                <p className="truncate w-32 mt-0.5">{appUser?.email}</p>
                                {isAdmin && <p className="text-amber-400 mt-1 flex items-center gap-1 font-medium"><IconLock size={10}/> 최고 관리자</p>}
                            </div>
                            <button onClick={handleLogout} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors" title="로그아웃"><IconLogOut size={16} /></button>
                        </div>
                    </div>
                </aside>

                <main className="flex-1 overflow-auto flex flex-col relative print:overflow-visible">
                    <header className="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 shadow-sm shrink-0 sticky top-0 z-10 print:hidden">
                        <h2 className="text-xl font-semibold text-slate-800 flex items-center gap-3">
                            {activeTab === 'dashboard' && '영업 대시보드'}
                            {activeTab === 'accounts' && '거래처'}
                            {activeTab === 'transactions' && '거래명세서 작성 및 관리'}
                            {activeTab === 'receivables' && '미수금/채권 통합 현황'}
                            {!isAdmin && <span className="text-xs font-medium bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full flex items-center gap-1"><IconLock size={12}/> 조회 전용 모드</span>}
                        </h2>
                        <div className="relative">
                            <IconSearch size={20} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                            <input type="text" placeholder="통합 검색..." className="pl-10 pr-4 py-2 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 bg-slate-50" />

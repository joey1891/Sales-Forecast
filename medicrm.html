<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
        }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; border: none !important; }
            .fixed.inset-0.bg-slate-900\/50 { background: transparent !important; }
            .print-hide { display: none !important; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

        // 고객님께서 제공해주신 Supabase URL 및 API Key 적용
        const supabaseUrl = 'https://mfnzqerkzsvdsaszuwil.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mbnpxZXJrenN2ZHNhc3p1d2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTc0NjgsImV4cCI6MjA5NjU5MzQ2OH0.i9tSTw8r8plr7JTcTFg54bzIGw8XipNSsddx14MhznY';

        const { useState, useEffect, Fragment } = React;

        const ACCOUNT_CATEGORIES = {
            HOSPITAL: ['병의원', '체인병의원', '병의원 도매', '병의원 온라인 도매'],
            PHARMACY: ['일반약국', '체인약국', '창고형 약국', '약국 도매', '약국 온라인 도매']
        };
        const ALL_ACCOUNT_TYPES = [...ACCOUNT_CATEGORIES.HOSPITAL, ...ACCOUNT_CATEGORIES.PHARMACY];

        // --- Icon Components ---
        const IconBuilding2 = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>;

        const IconUsers = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconFileSpreadsheet = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>;
        const IconCreditCard = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>;

        const IconSearch = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const IconAlertCircle = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const IconFileText = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
        const IconCheckCircle2 = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconPlus = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>;
        const IconUserCircle = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg>;
        const IconPhone = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
        const IconMail = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
        const IconMapPin = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
        const IconCalendar = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
        const IconPrinter = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
        const IconX = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>;

        function App() {
            const [appUser, setAppUser] = useState(null); 
            const [authChecking, setAuthChecking] = useState(true);
            
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [rememberId, setRememberId] = useState(false);
            const [keepLoggedIn, setKeepLoggedIn] = useState(false);
            const [isRegistering, setIsRegistering] = useState(false);
            const [authError, setAuthError] = useState('');

            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [accounts, setAccounts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [visits, setVisits] = useState([]);

            const [isAccountModalOpen, setIsAccountModalOpen] = useState(false);
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [printTransaction, setPrintTransaction] = useState(null);
            const [selectedAccount, setSelectedAccount] = useState(null);
            
            const [selectedSource, setSelectedSource] = useState('온라인 검색');
            const [transactionFilter, setTransactionFilter] = useState('all');
            const [receivableFilter, setReceivableFilter] = useState('all');
            const [dbError, setDbError] = useState(''); // DB 저장 실패 시 보여줄 에러 상태 추가

            // Supabase 데이터 로드 함수
            const loadData = async () => {
                try {
                    const [accRes, txRes, visRes] = await Promise.all([
                        supabase.from('accounts').select('*').order('created_at', { ascending: false }),
                        supabase.from('transactions').select('*').order('date', { ascending: false }),
                        supabase.from('visits').select('*').order('date', { ascending: false })
                    ]);
                    
                    if (accRes.data) setAccounts(accRes.data);
                    if (txRes.data) setTransactions(txRes.data);
                    if (visRes.data) setVisits(visRes.data);
                } catch (err) {
                    console.error("데이터 로딩 에러:", err);
                }
            };

            // Supabase Native Auth 세션 체크 (공식 인증 시스템 연동)
            useEffect(() => {
                const checkSession = async () => {
                    // Supabase 기본 세션 가져오기
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        setAppUser({ 
                            email: session.user.email, 
                            name: session.user.user_metadata?.name || '최고 관리자' 
                        });
                    }

                    // 아이디 기억하기 로컬 스토리지 확인
                    const savedEmail = localStorage.getItem('hym_remember_email');
                    if (savedEmail) {
                        setLoginEmail(savedEmail);
                        setRememberId(true);
                    }
                    
                    setAuthChecking(false);
                };
                
                checkSession();

                // 인증 상태 실시간 구독 (로그인/로그아웃 즉시 감지)
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) {
                        setAppUser({ 
                            email: session.user.email, 
                            name: session.user.user_metadata?.name || '최고 관리자' 
                        });
                    } else {
                        setAppUser(null);
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            // 로그인 성공 시 데이터 로드
            useEffect(() => {
                if (appUser) {
                    loadData();
                }
            }, [appUser]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');

                try {
                    // Supabase 내장 Auth 시스템으로 로그인
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: loginEmail,
                        password: loginPassword,
                    });
                    
                    if (error) {
                        if (error.message.includes('Invalid login credentials')) {
                            setAuthError('이메일 또는 비밀번호가 일치하지 않습니다.');
                        } else {
                            setAuthError(error.message);
                        }
                        return;
                    }

                    // 아이디 저장 처리
                    if (rememberId) {
                        localStorage.setItem('hym_remember_email', loginEmail);
                    } else {
                        localStorage.removeItem('hym_remember_email');
                    }
                } catch (err) {
                    setAuthError('로그인 처리 중 오류가 발생했습니다.');
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthError('');
                
                const name = e.target.name.value;
                const email = e.target.email.value;
                const password = e.target.password.value;

                try {
                    // Supabase 내장 Auth 시스템으로 회원가입
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: { name: name }
                        }
                    });
                    
                    if (error) {
                        if (error.message.includes('already registered')) {
                            setAuthError('이미 가입된 이메일입니다.');
                        } else {
                            setAuthError(error.message);
                        }
                        return;
                    }
                    
                    setIsRegistering(false);
                    setLoginEmail(email);
                    setAuthError('회원가입이 완료되었습니다. 로그인해주세요.');
                } catch (err) {
                    setAuthError('회원가입 처리 중 오류가 발생했습니다.');
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                if (!rememberId) setLoginEmail('');
                setLoginPassword('');
            };

            const isAdmin = appUser?.email === 'wjshin2450@gmail.com';

            const totalReceivables = accounts.reduce((sum, acc) => sum + Number(acc.receivable || 0), 0);
            const thisMonth = new Date().toISOString().substring(0, 7); 
            const thisMonthSales = transactions
                .filter(t => t.date.startsWith(thisMonth))
                .reduce((sum, t) => sum + Number(t.amount || 0), 0);
            const collectedSales = transactions
                .filter(t => t.status === '수금완료')
                .reduce((sum, t) => sum + Number(t.amount || 0), 0);

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(amount);
            };

            const getFilteredAccounts = (list, filterType) => {
                if (filterType === 'all') return list;
                return list.filter(acc => {
                    const isHospital = ACCOUNT_CATEGORIES.HOSPITAL.includes(acc.type);
                    const isPharmacy = ACCOUNT_CATEGORIES.PHARMACY.includes(acc.type);
                    if (filterType === 'hospital') return isHospital;
                    if (filterType === 'pharmacy') return isPharmacy;
                    return true;
                });
            };

            const handleAddAccount = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                setDbError(''); // 에러 초기화
                
                const formData = new FormData(e.target);
                const newAccount = {
                    name: formData.get('name'),
                    type: formData.get('type'),
                    contact: formData.get('contact'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    address: formData.get('address'),
                    collectionDay: formData.get('collectionDay'),
                    paymentMethod: formData.get('paymentMethod'),
                    salesRepName: formData.get('salesRepName'),
                    salesRepPhone: formData.get('salesRepPhone'),
                    stage: formData.get('stage'),
                    source: formData.get('source'),
                    sourceDetail: formData.get('sourceDetail') || '',
                    meetDate: formData.get('meetDate') || '',
                    firstTradeDate: formData.get('firstTradeDate') || '',
                    lastTradeDate: formData.get('firstTradeDate') || '',
                    collectionPlanDate: '', 
                    receivable: 0
                };
                
                try {
                    // error 객체를 추출하여 실패 여부를 반드시 확인합니다.
                    const { error } = await supabase.from('accounts').insert([newAccount]);
                    if (error) throw error; // 에러가 있으면 catch문으로 넘김
                    
                    setIsAccountModalOpen(false);
                    loadData();
                } catch (err) {
                    console.error("거래처 추가 오류:", err);
                    setDbError('데이터베이스 저장 실패: ' + (err.message || '알 수 없는 오류'));
                }
            };

            const handleAddTransaction = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                setDbError(''); // 에러 초기화

                const formData = new FormData(e.target);
                const amount = Number(formData.get('amount'));
                const accountId = formData.get('accountId');
                const transactionDate = formData.get('date');
                const paymentMethod = formData.get('paymentMethod');
                
                const newTransaction = {
                    accountId: accountId,
                    date: transactionDate,
                    title: formData.get('title'),
                    amount: amount,
                    status: '청구됨',
                    paymentMethod: paymentMethod
                };
                
                try {
                    const { error } = await supabase.from('transactions').insert([newTransaction]);
                    if (error) throw error;
                    
                    const targetAccount = accounts.find(a => a.id === accountId);
                    if (targetAccount) {
                        const newReceivable = Number(targetAccount.receivable || 0) + amount;
                        const { error: updateError } = await supabase.from('accounts').update({
                            receivable: newReceivable,
                            lastTradeDate: transactionDate,
                            stage: '거래개시' 
                        }).eq('id', accountId);
                        if (updateError) throw updateError;
                    }
                    setIsTransactionModalOpen(false);
                    loadData();
                } catch (err) {
                    console.error("명세서 추가 오류:", err);
                    setDbError('명세서 저장 실패: ' + (err.message || '알 수 없는 오류'));
                }
            };

            const handleAddVisit = async (e) => {
                e.preventDefault();
                if (!selectedAccount || !isAdmin) return;
                setDbError(''); // 에러 초기화

                const formData = new FormData(e.target);
                const newVisit = {
                    accountId: selectedAccount.id,
                    date: formData.get('date'),
                    note: formData.get('note'),
                    author: appUser.name
                };
                
                try {
                    const { error } = await supabase.from('visits').insert([newVisit]);
                    if (error) throw error;
                    
                    e.target.reset(); 
                    loadData();
                } catch (err) {
                    console.error("방문 기록 추가 오류:", err);
                    setDbError('방문 기록 저장 실패: ' + (err.message || '알 수 없는 오류'));
                }
            };

            const handleUpdateCollectionDate = async (accountId, newDate) => {
                if (!isAdmin) return;
                try {
                    await supabase.from('accounts').update({ collectionPlanDate: newDate }).eq('id', accountId);
                    loadData();
                } catch (err) {
                    console.error("수금 계획일 업데이트 오류:", err);
                }
            };

            if (authChecking) {
                return <div className="h-screen w-screen flex items-center justify-center bg-slate-50"><div className="animate-pulse text-blue-600 font-bold">시스템 초기화 중...</div></div>;
            }

            if (!appUser) {
                return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                    <div className="bg-slate-900 p-8 text-center">
                        <div className="inline-block bg-blue-600 p-3 rounded-xl mb-4 shadow-lg">
                        <IconBuilding2 className="w-8 h-8 text-white" />
                        </div>
                        <h1 className="text-2xl font-bold text-white tracking-tight">(주)힘 CRM 시스템</h1>
                        <p className="text-slate-400 text-sm mt-2">임직원 전용 영업/채권 관리 (Supabase)</p>

                    <h4 className="text-sm font-medium text-slate-500 mb-1">{title}</h4>
                    <div className="text-2xl font-bold text-slate-800">{amount}</div>
                </div>
                <div className="p-3 bg-slate-50 rounded-full shrink-0">
                    {icon}
                </div>
                </div>
            );
        }

        function Modal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 print:absolute print:inset-0 print:bg-transparent print:backdrop-blur-none print:p-0">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col max-h-[90vh] print:max-h-none print:shadow-none print:rounded-none">
                    <div className="flex justify-between items-center p-5 border-b border-slate-200 bg-slate-50 shrink-0 print-hide">
                    <h2 className="text-lg font-bold text-slate-800">{title}</h2>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors p-1 hover:bg-slate-200 rounded">
                        <IconX size={20} />
                    </button>
                    </div>
                    <div className="p-6 overflow-y-auto print:overflow-visible print:p-0">
                    {children}
                    </div>
                </div>
                </div>
            );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

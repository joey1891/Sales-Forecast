        const Icon = ({ name, size = 24, className = "" }) => {
            const svgRef = React.useRef(null);
            React.useEffect(() => {
                if (svgRef.current && lucide.icons[name]) {
                    const iconNode = lucide.icons[name];
                    const svgString = `<svg class="lucide lucide-${name} ${className}" xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconNode.map(node => `<${node[0]} ${Object.entries(node[1]).map(([k, v]) => `${k}="${v}"`).join(' ')}></${node[0]}>`).join('')}</svg>`;
                    svgRef.current.innerHTML = svgString;
                }
            }, [name, size, className]);
            return <span ref={svgRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        // 거래명세서 타이틀(JSON) 파싱 함수 (App 밖으로 분리)
        const parseTxTitle = (titleStr, fallbackAmount) => {
            try {
                const parsed = JSON.parse(titleStr);
                if (parsed.summary) return parsed;
                return { summary: titleStr, items: [{ name: titleStr, qty: 1, price: fallbackAmount || 0 }], promos: {}, isTaxApplied: false, taxAmount: 0 };
            } catch (e) {
                return { summary: titleStr, items: [{ name: titleStr, qty: 1, price: fallbackAmount || 0 }], promos: {}, isTaxApplied: false, taxAmount: 0 };
            }
        };

        function App() {
            const [user, setUser] = useState(null);

            const [loginEmail, setLoginEmail] = useState('');

            const [registerName, setRegisterName] = useState('');

            const [selectedAccount, setSelectedAccount] = useState(null);
            const [isEditingAccount, setIsEditingAccount] = useState(false);
            const [accountModalTab, setAccountModalTab] = useState('info'); 
            
            const [selectedSource, setSelectedSource] = useState('온라인 검색');
            const [selectedType, setSelectedType] = useState(ACCOUNT_CATEGORIES.VENDOR_PRIMARY[0]);
            
            const [transactionFilter, setTransactionFilter] = useState('all');
            const [txTypeFilter, setTxTypeFilter] = useState('all');

            const [payableFilter, setPayableFilter] = useState('all'); 
            
            const [dbError, setDbError] = useState(''); 
            const [dashboardMonth, setDashboardMonth] = useState(new Date().toISOString().substring(0, 7));
            const [expandedGroups, setExpandedGroups] = useState([]);

            // 과거 품목 내역 추출 (자동완성용)

                    const parsed = parseTxTitle(t.title, t.amount);
                    if (parsed && parsed.items) {
                        parsed.items.forEach(item => {
                            if (item.name && item.name.trim() !== '') products.add(item.name.trim());
                        });
                    }
                });
                return Array.from(products).sort();
            }, [transactions]);

            const uniqueContacts = useMemo(() => {
                const contacts = accounts.map(a => a.contact).filter(c => c && c.trim() !== '');
                return [...new Set(contacts)];
            }, [accounts]);

            const uniqueSalesReps = useMemo(() => {
                const reps = accounts.map(a => ({ name: a.salesRepName, phone: a.salesRepPhone }))
                                     .filter(r => r.name && r.name.trim() !== '');
                const uniqueReps = [];
                const map = new Map();
                for (const item of reps) {
                    if(!map.has(item.name)){
                        map.set(item.name, true);
                        uniqueReps.push(item);
                    }
                }
                return uniqueReps;
            }, [accounts]);

            const [alertMsg, setAlertMsg] = useState('');
            const [confirmDialog, setConfirmDialog] = useState(null);

                try { return JSON.parse(localStorage.getItem('hym_account_draft')) || {}; } 
                catch { return {}; }
            };
            const currentDraft = useMemo(() => isAccountModalOpen ? getAccountDraft() : {}, [isAccountModalOpen]);

            useEffect(() => {
                const checkSession = async () => {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        setUser(session.user);
                        fetchAppUser(session.user.email);
                    } else {
                        const savedEmail = localStorage.getItem('hym_remembered_email');
                        if(savedEmail) { setLoginEmail(savedEmail); setRememberId(true); }
                        setAuthChecking(false);
                    }
                };
                checkSession();

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session) { setUser(session.user); fetchAppUser(session.user.email); } 
                    else { setUser(null); setAppUser(null); }
                });
                return () => subscription.unsubscribe();
            }, []);

            const fetchAppUser = async (email) => {
                try {
                    const { data, error } = await supabase.from('hym_users').select('*').eq('email', email).single();
                    if (data) setAppUser(data);
                    else setAppUser({ email: email, name: email.split('@')[0], phone: '' });
                } catch (e) { console.error(e); } 
                finally { setAuthChecking(false); }
            };

            const loadData = async () => {
                if (!user) return;
                try {
                    const [accRes, txRes, visRes, calRes] = await Promise.all([
                        supabase.from('accounts').select('*').order('created_at', { ascending: false }),
                        supabase.from('transactions').select('*').order('date', { ascending: false }),
                        supabase.from('visits').select('*').order('date', { ascending: false }),
                        supabase.from('calendar_events').select('*').order('date', { ascending: true })

                    if(txRes.data) setTransactions(txRes.data);
                    if(visRes.data) setVisits(visRes.data);
                    if(calRes.data) setEvents(calRes.data);
                } catch (err) { console.error("데이터 로딩 오류:", err); }
            };

            useEffect(() => { loadData(); }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (authMode === 'register') {
                        if (loginPassword.length < 6) { setAuthError('비밀번호는 6자리 이상이어야 합니다.'); return; }
                        const { data, error } = await supabase.auth.signUp({
                            email: loginEmail, password: loginPassword,
                            options: { data: { name: registerName } }
                        });
                        if (error) throw error;
                        
                        if (data?.user?.identities?.length === 0) {
                            setAuthError('이미 가입된 이메일입니다.');
                        } else {
                            setAlertMsg('계정 생성이 완료되었습니다.\n(Confirm Email 설정이 켜져있다면 이메일 인증 후 로그인 가능합니다.)');
                            setAuthMode('login');
                        }
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({ email: loginEmail, password: loginPassword });
                        if (error) throw error;
                        
                        if (rememberId) localStorage.setItem('hym_remembered_email', loginEmail);
                        else localStorage.removeItem('hym_remembered_email');
                    }
                } catch (err) {
                    if (err.message.includes('Invalid login credentials')) setAuthError('이메일 또는 비밀번호가 일치하지 않습니다.');
                    else if (err.message.includes('Email not confirmed')) setAuthError('이메일 인증이 필요합니다. (이메일 수신함을 확인해주세요)');
                    else setAuthError('오류: ' + err.message);
                }
            };

            const handleLogout = async () => {
                await supabase.auth.signOut();
                if (!rememberId) setLoginEmail('');
                setLoginPassword('');
                sessionStorage.removeItem('hym_active_tab');
            };

            const isAdmin = appUser?.email === 'wjshin2450@gmail.com' || appUser?.email === 'test@test.com';

            const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' }).format(amount || 0);

            const extractRegion = (address) => {
                if (!address) return '미입력/기타';
                for (const region of REGIONS) {
                    if (address.includes(region)) return region;
                }
                return '미입력/기타';
            };

            const extractSubRegion = (address, region) => {
                if (!address) return '기타 상세지역';
                const parts = address.split(' ').filter(p => p.trim() !== '');
                let subRegion = '';
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    if (part.includes('시') && part !== '서울특별시' && part !== '부산광역시' && part !== '대구광역시' && part !== '인천광역시' && part !== '광주광역시' && part !== '대전광역시' && part !== '울산광역시') {
                        if (parts[i+1] && (parts[i+1].endsWith('구') || parts[i+1].endsWith('군'))) {
                            subRegion = `${part} ${parts[i+1]}`; break;
                        } else {
                            subRegion = part; break;
                        }
                    } else if (part.endsWith('구') || part.endsWith('군')) {
                        subRegion = part; break;
                    }
                }
                return subRegion || '기타 상세지역';
            };

            const toggleGroup = (groupId) => {
                setExpandedGroups(prev => prev.includes(groupId) ? prev.filter(id => id !== groupId) : [...prev, groupId]);
            };

                const allIds = [];

                    let categories = [];

                    else if (activeTab === 'vendor_investor') categories = [...ACCOUNT_CATEGORIES.INVESTOR, '미분류'];
                    else if (activeTab === 'vendor_design') categories = [...ACCOUNT_CATEGORIES.DESIGN, '미분류'];
                    else if (activeTab === 'vendor_interpreter' || activeTab === 'vendor_consulting') categories = [...ACCOUNT_CATEGORIES.OVERSEAS, '미분류'];
                    
                    categories.forEach(p => allIds.push(`vendor-group-${p}`));
                } else if (activeTab === 'accounts') {
                    ['리드', '잠재고객', '거래처', '미분류'].forEach(stage => {
                        REGIONS.concat(['미입력/기타']).forEach(reg => allIds.push(`dom-${stage}-${reg}`));

                } else if (activeTab === 'group_purchase') {
                    ['리드', '잠재고객', '거래처', '미분류'].forEach(stage => {
                        REGIONS.concat(['미입력/기타']).forEach(reg => allIds.push(`gp-${stage}-${reg}`));

                    ['리드', '잠재고객', '거래처', '미분류'].forEach(stage => {

                localStorage.setItem('hym_account_draft', JSON.stringify(draft));

            const handleAddVendor = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                setDbError(''); 
                const formData = new FormData(e.target);
                
                const newAccount = {
                    name: formData.get('name'), type: formData.get('type'), contact: formData.get('contact'),

            const handleTransactionSubmit = async (e) => {
                e.preventDefault();
                if (!isAdmin) return;
                const formData = new FormData(e.target);
                const accountId = formData.get('accountId');
                const txType = formData.get('txType') || 'sales'; 
                
                if (txItems.length === 0 || !txItems[0].name) {
                    setAlertMsg('최소 1개의 품목을 입력해주세요.'); return;
                }

                // 공급가액 총합
                const subTotalAmount = txItems.reduce((sum, item) => sum + (Number(item.qty) * Number(item.price)), 0);
                
                // 부가세 계산
                const calculatedTaxAmount = isTaxApplied ? Math.floor(subTotalAmount * 0.1) : 0;
                
                // 총합계 (공급가액 + 부가세)
                const txTotalAmount = subTotalAmount + calculatedTaxAmount;

                const summaryName = txItems.length > 1 ? `${txItems[0].name} 외 ${txItems.length - 1}건` : txItems[0].name;
                const complexTitle = JSON.stringify({ 
                    summary: summaryName, 
                    items: txItems, 
                    promos: txPromos, 
                    isTaxApplied: isTaxApplied, 
                    taxAmount: calculatedTaxAmount 
                });
                
                try {
                    if (editingTransaction) {
                        const { error: txError } = await supabase.from('transactions').update({
                            "accountId": accountId, date: formData.get('date'), title: complexTitle, 
                            amount: txTotalAmount, "paymentMethod": formData.get('paymentMethod'), "txType": txType
                        }).eq('id', editingTransaction.id);
                        if (txError) throw txError;
                        
                        if (editingTransaction.accountId === accountId) {
                            const diffAmount = txTotalAmount - editingTransaction.amount;
                            if (diffAmount !== 0) {
                                const targetAccount = accounts.find(a => a.id === accountId);
                                if (targetAccount) {
                                    if(txType === 'sales') {
                                        await supabase.from('accounts').update({ receivable: (Number(targetAccount.receivable) || 0) + diffAmount }).eq('id', accountId);
                                    } else {
                                        await supabase.from('accounts').update({ payable: (Number(targetAccount.payable) || 0) + diffAmount }).eq('id', accountId);
                                    }
                                }
                            }
                        }
                    } else {
                        const newTransaction = {
                            "accountId": accountId, date: formData.get('date'), title: complexTitle, amount: txTotalAmount,
                            status: txType === 'sales' ? '청구됨' : '지급대기', 
                            "paymentMethod": formData.get('paymentMethod'), "txType": txType
                        };
                        const { error: txError } = await supabase.from('transactions').insert([newTransaction]);
                        if (txError) throw txError;
                        
                        const targetAccount = accounts.find(a => a.id === accountId);
                        if (targetAccount) {
                            if (txType === 'sales') {
                                await supabase.from('accounts').update({
                                    receivable: (Number(targetAccount.receivable) || 0) + txTotalAmount,
                                    "lastTradeDate": formData.get('date'), stage: '거래처' 
                                }).eq('id', accountId);
                            } else {
                                await supabase.from('accounts').update({
                                    payable: (Number(targetAccount.payable) || 0) + txTotalAmount,
                                    "lastTradeDate": formData.get('date')
                                }).eq('id', accountId);
                            }
                        }

                    setIsTransactionModalOpen(false);
                    setEditingTransaction(null);
                    setTxItems([{ name: '', qty: 1, price: 0 }]);
                    setIsTaxApplied(false);
                    setTxPromos({ fixture: false, wobbler: false, poster: false, stand: false });
                    loadData();

                    setAlertMsg('명세서 저장에 실패했습니다: ' + err.message);

                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-medium text-slate-700 mb-1">일정 제목 (대상자 등)</label>
                                    <input type="text" required value={calEventTitle} onChange={(e) => setCalEventTitle(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500" placeholder="예: 김원장님 2차 미팅" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">상세 메모</label>
                                <textarea value={calEventNote} onChange={(e) => setCalEventNote(e.target.value)} rows="4" className="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-blue-500" placeholder="상세 내용을 입력하세요 (선택사항)"></textarea>
                            </div>
                            <div className="flex justify-end gap-2 pt-4 border-t border-slate-200 mt-4">
                                <button type="button" onClick={() => setIsEventModalOpen(false)} className="px-4 py-2 border border-slate-300 rounded-md text-slate-700 hover:bg-slate-50 font-medium">취소</button>
                                <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">저장</button>
                            </div>
                        </form>
                    </Modal>
                )}

                {alertMsg && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
                        <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm text-center">
                            <Icon name="AlertCircle" size={48} className="mx-auto text-amber-500 mb-4" />
                            <p className="text-slate-800 font-medium mb-6 whitespace-pre-wrap">{alertMsg}</p>
                            <button onClick={() => setAlertMsg('')} className="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors">확인</button>
                        </div>
                    </div>
                )}
                {confirmDialog && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4 animate-fade-in">
                        <div className="bg-white rounded-xl shadow-xl p-6 w-full max-w-md text-center">
                            <Icon name="AlertCircle" size={48} className="mx-auto text-amber-500 mb-4" />
                            <p className="text-slate-800 font-medium mb-6 whitespace-pre-wrap">{confirmDialog.message}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-100 text-slate-700 py-2 rounded-lg font-medium hover:bg-slate-200 transition-colors">취소</button>
                                <button onClick={confirmDialog.onConfirm} className="flex-1 bg-red-600 text-white py-2 rounded-lg font-medium hover:bg-red-700 transition-colors">확인 및 실행</button>
                            </div>
                        </div>
                    </div>
                )}
                </div>
            );
        }

        function Modal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
                    <div className="flex justify-between items-center p-5 border-b border-slate-200 bg-slate-50 shrink-0">
                    <h2 className="text-lg font-bold text-slate-800">{title}</h2>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 hover:bg-slate-200 rounded transition-colors"><Icon name="X" size={20} /></button>
                    </div>
                    <div className="p-6 overflow-y-auto">{children}</div>
                </div>
                </div>
            );
        }

        function SidebarItem({ icon, label, isActive, onClick, isOpen = true }) {
            return (
                <button
                    onClick={onClick}
                    title={!isOpen ? label : undefined}
                    className={`w-full flex items-center gap-3 py-3 rounded-lg transition-all duration-200 ${isOpen ? 'px-4' : 'px-0 justify-center'} ${isActive ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                >
                    <div className="shrink-0">{icon}</div>
                    {isOpen && <span className="font-medium text-sm whitespace-nowrap">{label}</span>}
                </button>
            );
        }

        function KpiCard({ title, amount, icon, color }) {
            return (
                <div className={`bg-white p-6 rounded-xl shadow-sm border-l-4 ${color} border-y border-r border-slate-200 flex items-center justify-between hover:shadow-md transition-shadow`}>
                    <div>
                        <h4 className="text-sm font-medium text-slate-500 mb-1">{title}</h4>
                        <div className="text-2xl font-bold text-slate-800">{amount}</div>
                    </div>
                    <div className="p-3 bg-slate-50 rounded-full shrink-0">{icon}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
